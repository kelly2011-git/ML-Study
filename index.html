/* ---------- design matrix ---------- */
DEMOS.design = { hint: 'Clique sur une case du tableau pour voir comment on la nomme.', mount(el) {
  const feats = ['Size (cm)', 'Pointy ears', 'Good eater', 'Human contact'];
  const X = [[30, 1, 4, 3], [62, 0, 9, 9], [25, 1, 3, 2], [48, 1, 8, 8], [70, 0, 7, 9], [28, 1, 5, 4]];
  const y = [-1, 1, -1, 1, 1, -1];
  let sel = [2, 1];
  el.innerHTML = `<div class="tbl-wrap"><table class="dm" data-t></table></div><div class="callout" data-c></div>
    <div class="stat"><div><small>n (observations)</small><b>6</b></div><div><small>p (features)</small><b>4</b></div><div><small>Taille de X</small><b>6 × 4</b></div><div><small>Taille de y</small><b>6</b></div></div>`;
  const draw = () => {
    const [r, c] = sel;
    let s = `<tr><th></th>${feats.map((f, j) => `<th class="${j === c ? 'sel-c' : ''}">x<sub>·${j + 1}</sub> ${f}</th>`).join('')}<th class="${c === 4 ? 'sel-c' : ''}" style="border-left:3px solid var(--muted)">y (label)</th></tr>`;
    X.forEach((row, i) => {
      s += `<tr><th class="${i === r ? 'sel-r' : ''}">x<sub>${i + 1}</sub></th>` + row.map((v, j) => `<td data-r="${i}" data-c="${j}" class="${i === r ? 'sel-r' : ''} ${j === c ? 'sel-c' : ''}" style="cursor:pointer">${v}</td>`).join('') +
        `<td data-r="${i}" data-c="4" class="${i === r ? 'sel-r' : ''} ${c === 4 ? 'sel-c' : ''}" style="cursor:pointer;border-left:3px solid var(--muted)">${y[i] > 0 ? '+1 chien' : '−1 chat'}</td></tr>`;
    });
    $('[data-t]', el).innerHTML = s;
    $('[data-c]', el).innerHTML = c === 4
      ? `<b>y<sub>${r + 1}</sub> = ${y[r] > 0 ? '+1' : '−1'}</b> : le label de l'observation ${r + 1}. C'est ce que le modèle doit apprendre à prédire.`
      : `<b>x<sub>${r + 1},${c + 1}</sub> = ${X[r][c]}</b> : la valeur de la feature ${c + 1} (« ${feats[c]} ») pour l'observation ${r + 1}. La ligne en bleu est le vecteur <b>x<sub>${r + 1}</sub></b> (un animal) ; la colonne en rouge est une feature (mesurée sur tous les animaux).`;
  };
  $('[data-t]', el).addEventListener('click', e => { const td = e.target.closest('td'); if (!td) return; sel = [+td.dataset.r, +td.dataset.c]; draw(); });
  draw();
}};

/* ---------- loss functions ---------- */
DEMOS.loss = { hint: 'Trois erreurs de prédiction sont petites. Déplace la quatrième pour en faire un outlier et regarde son poids dans chaque loss.', mount(el) {
  el.innerHTML = slider('ls-e', 'Erreur du point 4 (y − f(x))', -4, 4, 0.1, 3) + `<div class="grid2" style="margin-top:12px"><svg class="plot" viewBox="0 0 360 250" data-p></svg><div data-s></div></div>`;
  const base = [0.5, -0.3, 0.2];
  const W = 360, H = 250, m = { l: 34, r: 10, t: 10, b: 30 }, sx = lin(-4, 4, m.l, W - m.r), sy = lin(0, 6, H - m.b, m.t);
  const L = { q: e => e * e, a: e => Math.abs(e), z: e => Math.abs(e) > 1e-9 ? 1 : 0 };
  const curve = f => { const p = []; for (let e = -4; e <= 4.001; e += 0.05) p.push([sx(e), sy(Math.min(f(e), 6.4))]); return pathOf(p); };
  const draw = e4 => {
    const errs = [...base, e4];
    let s = `<defs><clipPath id="ls-clip"><rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}"/></clipPath></defs>`;
    s += axesSVG({ W, H, m, sx, sy, xt: [-4, -2, 0, 2, 4], yt: [0, 2, 4, 6], xlab: 'erreur y − f(x)', ylab: 'loss' });
    s += `<g clip-path="url(#ls-clip)"><path d="${curve(L.q)}" fill="none" stroke="var(--pos)" stroke-width="2.2"/><path d="${curve(L.a)}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>
      <path d="M${sx(-4)} ${sy(1)}H${sx(4)}" fill="none" stroke="var(--ok)" stroke-width="2" stroke-dasharray="5 4"/><circle cx="${sx(0)}" cy="${sy(0)}" r="3" fill="var(--ok)"/>`;
    errs.forEach((e, i) => { const big = i === 3; s += `<circle cx="${sx(e)}" cy="${sy(Math.min(L.q(e), 6.2))}" r="${big ? 5 : 3.5}" fill="var(--pos)"/><circle cx="${sx(e)}" cy="${sy(L.a(e))}" r="${big ? 5 : 3.5}" fill="var(--accent)"/>`; });
    s += `</g><text x="${sx(-3.9)}" y="${sy(5.6)}" style="fill:var(--pos)">quadratic</text><text x="${sx(-3.9)}" y="${sy(3.4)}" style="fill:var(--accent)">absolute</text><text x="${sx(1.6)}" y="${sy(1) - 6}" style="fill:var(--ok)">0/1</text>`;
    $('[data-p]', el).innerHTML = s;
    const tot = f => errs.reduce((a, e) => a + f(e), 0), share = f => f(e4) / (tot(f) || 1);
    $('[data-s]', el).innerHTML = `<div class="metrics">
      <div class="metric"><span><span class="nm" style="color:var(--pos)">Quadratic</span><span class="al">Σ (y − f(x))² = ${fmt(tot(L.q))}</span></span><span class="val">${pct(share(L.q), 0)}</span></div>
      <div class="metric"><span><span class="nm" style="color:var(--accent)">Absolute</span><span class="al">Σ |y − f(x)| = ${fmt(tot(L.a))}</span></span><span class="val">${pct(share(L.a), 0)}</span></div>
      <div class="metric"><span><span class="nm" style="color:var(--ok)">0/1</span><span class="al">nombre d'erreurs = ${tot(L.z)}</span></span><span class="val">${pct(share(L.z), 0)}</span></div></div>
      <p class="small muted" style="margin:10px 0 0">Pourcentage = part du point 4 dans la loss totale. Avec la quadratic loss, un seul outlier peut peser presque tout : le modèle va se tordre pour lui.</p>`;
  };
  bindSlider(el, 'ls-e', v => fmt(v, 1), draw).go();
}};

/* ---------- overfitting ---------- */
const TRUEF = x => 0.9 * Math.sin(2.6 * x) + 0.3 * x;
function makeSet(r, n, sd, grid) { const xs = [], ys = []; for (let i = 0; i < n; i++) { const x = grid ? -1 + 2 * (i + 0.5) / n + (r() - 0.5) * 0.08 : r() * 2 - 1; xs.push(x); ys.push(TRUEF(x) + sd * randn(r)); } return { xs, ys }; }
DEMOS.overfit = { hint: 'Augmente le degré du polynôme (la complexité du modèle). Regarde la courbe rouge, puis les deux erreurs à droite.', mount(el) {
  let seed = 7, tr, te, errs;
  el.innerHTML = slider('of-d', 'Degré du polynôme', 0, 11, 1, 3) +
    `<div class="row" style="margin:6px 0 12px"><button class="btn sm" data-new>Nouveau tirage des données</button><span class="small muted">12 points d'entraînement · 200 points de test</span></div>
    <div class="grid2"><svg class="plot" viewBox="0 0 360 260" data-f></svg><svg class="plot" viewBox="0 0 360 260" data-e></svg></div><div class="callout" data-c></div>`;
  const W = 360, H = 260, m = { l: 36, r: 10, t: 10, b: 32 };
  const gen = () => { const r = rng(seed); tr = makeSet(r, 12, 0.3, true); te = makeSet(r, 200, 0.3, false);
    errs = []; for (let d = 0; d <= 11; d++) { const f = polyfit(tr.xs, tr.ys, d); errs.push([mse(f, tr.xs, tr.ys), mse(f, te.xs, te.ys)]); } };
  const draw = d => {
    const f = polyfit(tr.xs, tr.ys, d);
    const sx = lin(-1.05, 1.05, m.l, W - m.r), sy = lin(-2.4, 2.4, H - m.b, m.t);
    let s = `<defs><clipPath id="of-clip"><rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}"/></clipPath></defs>` + axesSVG({ W, H, m, sx, sy, xt: [-1, 0, 1], yt: [-2, 0, 2], xlab: 'x', ylab: 'y' });
    te.xs.forEach((x, i) => s += `<circle cx="${sx(x)}" cy="${sy(te.ys[i])}" r="2" fill="var(--muted)" opacity=".3"/>`);
    const P = [], Q = []; for (let x = -1.05; x <= 1.05; x += 0.01) { P.push([sx(x), sy(TRUEF(x))]); Q.push([sx(x), sy(clamp(f(x), -3, 3))]); }
    s += `<g clip-path="url(#of-clip)"><path d="${pathOf(P)}" fill="none" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1.5"/><path d="${pathOf(Q)}" fill="none" stroke="var(--pos)" stroke-width="2.4"/></g>`;
    tr.xs.forEach((x, i) => s += `<circle cx="${sx(x)}" cy="${sy(tr.ys[i])}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>`);
    s += `<text x="${m.l + 6}" y="${m.t + 12}">● train   ∙ test   - - vraie fonction</text>`;
    $('[data-f]', el).innerHTML = s;
    const ex = lin(0, 11, m.l + 6, W - m.r - 6), ey = logsc(0.003, 10, H - m.b, m.t);
    let e = axesSVG({ W, H, m, sx: ex, sy: ey, xt: [0, 2, 4, 6, 8, 10], yt: [0.01, 0.1, 1, 10], xlab: 'complexité (degré)', ylab: 'MSE (échelle log)' });
    const line = k => pathOf(errs.map((v, i) => [ex(i), ey(clamp(v[k], 0.003, 10))]));
    e += `<line x1="${ex(d)}" x2="${ex(d)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--hl)" stroke-width="3" opacity=".7"/>`;
    e += `<path d="${line(0)}" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="${line(1)}" fill="none" stroke="var(--pos)" stroke-width="2"/>`;
    errs.forEach((v, i) => e += `<circle cx="${ex(i)}" cy="${ey(clamp(v[0], 0.003, 10))}" r="2.5" fill="var(--accent)"/><circle cx="${ex(i)}" cy="${ey(clamp(v[1], 0.003, 10))}" r="2.5" fill="var(--pos)"/>`);
    e += `<text x="${W - m.r - 4}" y="${m.t + 12}" text-anchor="end" style="fill:var(--pos)">test error</text><text x="${W - m.r - 4}" y="${m.t + 26}" text-anchor="end" style="fill:var(--accent)">training error</text>`;
    $('[data-e]', el).innerHTML = e;
    const best = errs.reduce((b, v, i) => v[1] < errs[b][1] ? i : b, 0), [trE, teE] = errs[d];
    let msg = d < best - 1 ? `<b>Underfitting.</b> Le modèle est trop simple : les deux erreurs sont élevées.` : d > best + 2 ? `<b>Overfitting.</b> Training error ${fmt(trE, 3)}, test error ${fmt(teE, 3)} : la courbe passe près des points bleus mais ne suit plus la vraie fonction.` : `<b>Bonne zone.</b> On est proche du minimum de la test error (degré ${best} sur ce tirage).`;
    $('[data-c]', el).innerHTML = msg; $('[data-c]', el).className = 'callout' + (d >= best - 1 && d <= best + 2 ? ' ok' : '');
  };
  const sl = bindSlider(el, 'of-d', v => v, draw);
  $('[data-new]', el).addEventListener('click', () => { seed = (seed * 31 + 11) % 99991; gen(); sl.go(); });
  gen(); sl.go();
}};

/* ---------- bias-variance ---------- */
DEMOS.biasvar = { hint: 'On entraîne le même modèle sur 25 training sets différents (chaque courbe fine = un modèle). Change la complexité.', mount(el) {
  const NS = 25, grid = []; for (let x = -0.9; x <= 0.901; x += 0.03) grid.push(x);
  const sd = 0.35, sets = []; const r = rng(42); for (let k = 0; k < NS; k++) sets.push(makeSet(r, 15, sd, false));
  const res = []; for (let d = 0; d <= 9; d++) {
    const fs = sets.map(s => polyfit(s.xs, s.ys, d)); const preds = fs.map(f => grid.map(f));
    const mean = grid.map((_, j) => preds.reduce((a, p) => a + p[j], 0) / NS);
    const b2 = grid.reduce((a, x, j) => a + (mean[j] - TRUEF(x)) ** 2, 0) / grid.length;
    const vr = grid.reduce((a, _, j) => a + preds.reduce((t, p) => t + (p[j] - mean[j]) ** 2, 0) / NS, 0) / grid.length;
    res.push({ preds, mean, b2, vr });
  }
  el.innerHTML = slider('bv-d', 'Complexité (degré)', 0, 9, 1, 1) + `<div class="grid2" style="margin-top:12px"><svg class="plot" viewBox="0 0 360 260" data-f></svg><svg class="plot" viewBox="0 0 360 260" data-e></svg></div><div class="stat" data-s></div>`;
  const W = 360, H = 260, m = { l: 36, r: 10, t: 10, b: 32 };
  const draw = d => {
    const R = res[d], sx = lin(-1, 1, m.l, W - m.r), sy = lin(-2.2, 2.2, H - m.b, m.t);
    let s = `<defs><clipPath id="bv-clip"><rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}"/></clipPath></defs>` + axesSVG({ W, H, m, sx, sy, xt: [-1, 0, 1], yt: [-2, 0, 2], xlab: 'x', ylab: 'y' }) + '<g clip-path="url(#bv-clip)">';
    R.preds.forEach(p => s += `<path d="${pathOf(p.map((v, j) => [sx(grid[j]), sy(clamp(v, -3, 3))]))}" fill="none" stroke="var(--pos)" stroke-width="1" opacity=".28"/>`);
    s += `<path d="${pathOf(grid.map(x => [sx(x), sy(TRUEF(x))]))}" fill="none" stroke="var(--ink)" stroke-dasharray="5 4" stroke-width="1.8"/>`;
    s += `<path d="${pathOf(R.mean.map((v, j) => [sx(grid[j]), sy(v)]))}" fill="none" stroke="var(--accent)" stroke-width="3"/></g>`;
    s += `<text x="${m.l + 6}" y="${m.t + 12}">— moyenne des modèles  - - vérité  ─ 25 modèles</text>`;
    $('[data-f]', el).innerHTML = s;
    const ex = lin(0, 9, m.l + 6, W - m.r - 6), ey = logsc(0.001, 3, H - m.b, m.t);
    let e = axesSVG({ W, H, m, sx: ex, sy: ey, xt: [0, 3, 6, 9], yt: [0.001, 0.01, 0.1, 1], fy: v => v, xlab: 'complexité (degré)', ylab: 'échelle log' });
    e += `<line x1="${ex(d)}" x2="${ex(d)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--hl)" stroke-width="3" opacity=".7"/>`;
    const L = (f, c, w = 2, da = '') => `<path d="${pathOf(res.map((v, i) => [ex(i), ey(clamp(f(v), 0.001, 3))]))}" fill="none" stroke="${c}" stroke-width="${w}" ${da}/>`;
    e += L(v => v.b2, 'var(--accent)') + L(v => v.vr, 'var(--pos)') + L(v => v.b2 + v.vr + sd * sd, 'var(--ink)', 2.4, 'stroke-dasharray="6 3"');
    e += `<text x="${W - m.r - 4}" y="${m.t + 12}" text-anchor="end" style="fill:var(--ink)">erreur totale</text><text x="${W - m.r - 4}" y="${m.t + 26}" text-anchor="end" style="fill:var(--accent)">bias²</text><text x="${W - m.r - 4}" y="${m.t + 40}" text-anchor="end" style="fill:var(--pos)">variance</text>`;
    $('[data-e]', el).innerHTML = e;
    $('[data-s]', el).innerHTML = `<div><small>Bias²</small><b style="color:var(--accent)">${fmt(R.b2, 3)}</b></div><div><small>Variance</small><b style="color:var(--pos)">${fmt(R.vr, 3)}</b></div><div><small>Bruit σ²</small><b>${fmt(sd * sd, 3)}</b></div><div><small>Erreur attendue</small><b>${fmt(R.b2 + R.vr + sd * sd, 3)}</b></div>`;
  };
  bindSlider(el, 'bv-d', v => v, draw).go();
}};

/* ---------- split : le piège du validation set ---------- */
DEMOS.split = { hint: 'Tous ces modèles ont exactement la même vraie accuracy : 70 %. On garde celui qui a le meilleur score de validation. Que vaut-il vraiment ?', mount(el) {
  let seed = 3;
  el.innerHTML = slider('sp-k', 'Modèles comparés', 1, 40, 1, 20) + slider('sp-n', 'Taille du validation set', 20, 500, 10, 50) +
    `<div class="row" style="margin:6px 0 10px"><button class="btn sm" data-new>Relancer</button></div><svg class="plot" viewBox="0 0 640 220" data-p></svg><div class="stat" data-s></div><div class="callout" data-c></div>`;
  const binom = (r, n, p) => { let k = 0; for (let i = 0; i < n; i++) if (r() < p) k++; return k / n; };
  const draw = () => {
    const K = +$('#sp-k', el).value, N = +$('#sp-n', el).value, r = rng(seed * 977 + K * 13 + N);
    const v = Array.from({ length: K }, () => binom(r, N, 0.7)); const b = v.indexOf(Math.max(...v)); const test = binom(r, 2000, 0.7);
    const W = 640, H = 220, m = { l: 40, r: 10, t: 10, b: 26 }, sy = lin(0.45, 0.95, H - m.b, m.t), bw = (W - m.l - m.r) / 40;
    let s = axesSVG({ W, H, m, sx: x => x, sy, yt: [0.5, 0.6, 0.7, 0.8, 0.9], fy: v => (v * 100).toFixed(0) + '%' });
    v.forEach((a, i) => { const x = m.l + i * bw + 2; s += `<rect x="${x}" y="${sy(a)}" width="${bw - 4}" height="${H - m.b - sy(a)}" rx="2" fill="${i === b ? 'var(--hl)' : 'var(--neg)'}" opacity="${i === b ? 1 : .45}"/>`; });
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${sy(0.7)}" y2="${sy(0.7)}" stroke="var(--ink)" stroke-dasharray="6 4" stroke-width="1.5"/><text x="${W - m.r}" y="${sy(0.7) - 5}" text-anchor="end" class="t-ink">vraie accuracy = 70 %</text>`;
    s += `<text x="${m.l}" y="${H - 6}">une barre = score de validation d'un modèle</text>`;
    $('[data-p]', el).innerHTML = s;
    $('[data-s]', el).innerHTML = `<div><small>Meilleur score de validation</small><b style="color:var(--warn)">${pct(v[b])}</b></div><div><small>Ce modèle sur le test set</small><b>${pct(test)}</b></div><div><small>Optimisme</small><b>+${fmt((v[b] - test) * 100, 1)} pts</b></div>`;
    $('[data-c]', el).innerHTML = K === 1 ? 'Avec un seul modèle, on ne choisit rien : le score de validation reste une estimation honnête.' : `En gardant le meilleur de ${K} modèles, on a surtout gardé celui qui a eu de la chance sur ce validation set. Le test set, jamais utilisé pour choisir, redonne la vraie valeur. Plus on compare de modèles et plus le validation set est petit, plus l'écart grandit.`;
  };
  bindSlider(el, 'sp-k', v => v, draw); bindSlider(el, 'sp-n', v => v, draw);
  $('#sp-k-o', el).textContent = 20; $('#sp-n-o', el).textContent = 50;
  $('[data-new]', el).addEventListener('click', () => { seed++; draw(); }); draw();
}};

/* ---------- cross-validation ---------- */
DEMOS.cv = { hint: 'Choisis k, puis lance l\'animation. Chaque ligne est un entraînement ; la case jaune est le fold de validation.', mount(el) {
  const n = 20, ks = [2, 4, 5, 10, 20]; let k = 5, cur = -1, timer = null;
  el.innerHTML = `<div class="row" style="margin-bottom:12px"><span class="small">k =</span><div class="seg" data-k>${ks.map(v => `<button data-v="${v}">${v === 20 ? '20 (LOO)' : v}</button>`).join('')}</div><button class="btn sm" data-play>▶ Animer</button></div>
    <div class="fold-grid" data-g></div><div class="stat" data-s></div><div class="metrics" style="margin-top:10px" data-m></div>`;
  const lvl = (x, c) => `<span style="display:inline-flex;gap:2px">${[0, 1, 2, 3, 4].map(i => `<i style="width:14px;height:8px;border-radius:2px;background:${i < x ? c : 'var(--line)'}"></i>`).join('')}</span>`;
  const meta = { 2: [5, 1, 1], 4: [3, 2, 2], 5: [2, 2, 2], 10: [1, 3, 3], 20: [0, 5, 5] };
  const draw = () => {
    $$('[data-k] button', el).forEach(b => b.classList.toggle('on', +b.dataset.v === k));
    let g = ''; for (let it = 0; it < k; it++) { g += `<div class="fold-row ${it === cur ? 'cur' : ''}" style="--k:${k}"><span>modèle ${it + 1}</span>${Array.from({ length: k }, (_, f) => `<i class="${f === it ? 'v' : ''}">${k <= 10 ? (f === it ? 'val' : n / k) : ''}</i>`).join('')}</div>`; }
    $('[data-g]', el).innerHTML = g;
    $('[data-s]', el).innerHTML = `<div><small>Entraînements</small><b>${k}</b></div><div><small>Train par modèle</small><b>${n * (k - 1) / k} pts</b></div><div><small>Validation par modèle</small><b>${n / k} pt${n / k > 1 ? 's' : ''}</b></div><div><small>Si n = 1000</small><b>${k === 20 ? 'k=n : 1000×' : 1000 * (k - 1) / k + ' / ' + 1000 / k}</b></div>`;
    const [b, v, c] = meta[k];
    $('[data-m]', el).innerHTML = `<div class="metric"><span><span class="nm">Biais de l'estimation</span><span class="al">modèles entraînés sur moins de données que le modèle final</span></span>${lvl(b, 'var(--warn)')}</div>
      <div class="metric"><span><span class="nm">Variance de l'estimation</span><span class="al">petits folds de validation, modèles très corrélés</span></span>${lvl(v, 'var(--pos)')}</div>
      <div class="metric"><span><span class="nm">Coût de calcul</span><span class="al">nombre d'entraînements</span></span>${lvl(c, 'var(--accent)')}</div>`;
  };
  $('[data-k]', el).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; k = +b.dataset.v; cur = -1; clearInterval(timer); draw(); });
  $('[data-play]', el).addEventListener('click', () => { clearInterval(timer); cur = 0; draw(); timer = setInterval(() => { cur++; if (cur >= k) { clearInterval(timer); cur = -1; } draw(); }, k > 10 ? 250 : 650); });
  draw();
}};

/* ---------- confusion matrix ---------- */
DEMOS.confusion = { hint: 'Modifie les 4 cases directement dans la matrice, ou charge un scénario. Toutes les métriques se recalculent.', mount(el) {
  const P = { 'Dépistage': [45, 5, 90, 860], 'Filtre anti-spam': [300, 60, 5, 635], 'Modèle paresseux': [0, 10, 0, 990], 'Équilibré': [400, 100, 100, 400] };
  let v = { tp: 45, fn: 5, fp: 90, tn: 860 };
  el.innerHTML = `<div class="row" style="margin-bottom:12px">${Object.keys(P).map(k => `<button class="btn sm" data-p="${k}">${k}</button>`).join('')}</div>
   <div class="grid2"><div class="tbl-wrap"><table class="cm"><tr><td colspan="2" rowspan="2" style="border:none"></td><th colspan="2">True class</th></tr><tr><th>−1</th><th>+1</th></tr>
   <tr><th rowspan="2">Predicted<br>class</th><th>−1</th><td class="cell-tn"><input class="mono" type="number" min="0" id="cm-tn" style="width:70px"><span class="lab">TN</span></td><td class="cell-fn"><input class="mono" type="number" min="0" id="cm-fn" style="width:70px"><span class="lab">FN · type II</span></td></tr>
   <tr><th>+1</th><td class="cell-fp"><input class="mono" type="number" min="0" id="cm-fp" style="width:70px"><span class="lab">FP · type I</span></td><td class="cell-tp"><input class="mono" type="number" min="0" id="cm-tp" style="width:70px"><span class="lab">TP</span></td></tr></table>
   <p class="small muted" data-tot style="text-align:center"></p></div><div class="metrics" data-m></div></div><div class="callout" data-c></div>`;
  $$('input', el).forEach(i => { i.style.cssText += ';border:1px solid var(--line);border-radius:5px;background:var(--surface);text-align:center;padding:3px;font-size:16px;display:block;margin:0 auto 2px'; });
  const set = () => ['tp', 'fn', 'fp', 'tn'].forEach(k => $('#cm-' + k, el).value = v[k]);
  const draw = () => {
    const { tp, fn, fp, tn } = v, N = tp + fn + fp + tn;
    const R = tp / (tp + fn), Pr = tp / (tp + fp), Sp = tn / (tn + fp), A = (tp + tn) / N, F1 = 2 * Pr * R / (Pr + R), FDR = fp / (tp + fp);
    const row = (nm, al, calc, val) => `<div class="metric"><span><span class="nm">${nm}</span><span class="al">${al}</span></span><span class="calc">${calc}<span class="val">${pct(val)}</span></span></div>`;
    $('[data-m]', el).innerHTML = row('Recall', 'sensitivity · TPR', `${tp} / (${tp} + ${fn})`, R) + row('Precision', 'PPV', `${tp} / (${tp} + ${fp})`, Pr) + row('Specificity', 'TNR', `${tn} / (${tn} + ${fp})`, Sp) + row('FDR', '1 − precision', `${fp} / (${tp} + ${fp})`, FDR) + row('Accuracy', '', `${tp + tn} / ${N}`, A) + row('F1-score', 'moyenne harmonique P, R', `2·P·R / (P + R)`, F1);
    $('[data-tot]', el).textContent = `${tp + fn} vrais positifs · ${tn + fp} vrais négatifs · ${N} au total`;
    let c = '';
    if (A > 0.9 && (R < 0.2 || !isFinite(Pr))) c = `<b>Accuracy paradox.</b> ${pct(A)} d'accuracy, mais le modèle ne trouve presque aucun positif (recall ${pct(R)}). L'accuracy est trompeuse quand les classes sont déséquilibrées.`;
    else if (R > 0.85 && Pr < 0.5) c = `Recall élevé, precision faible : on rate peu de positifs, mais beaucoup d'alertes sont fausses. C'est acceptable pour un dépistage, où un second test vérifiera.`;
    else if (Pr > 0.95 && R < 0.9) c = `Precision très élevée : quand le modèle dit +1, il a presque toujours raison. On accepte de rater quelques positifs (FN). C'est ce qu'on veut pour un filtre anti-spam : ne jamais jeter un vrai mail.`;
    else c = `Quand les classes sont équilibrées, accuracy et F1 racontent à peu près la même histoire.`;
    $('[data-c]', el).innerHTML = c;
  };
  el.addEventListener('input', e => { if (e.target.id?.startsWith('cm-')) { v[e.target.id.slice(3)] = Math.max(0, Math.round(+e.target.value || 0)); draw(); } });
  el.addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (!b) return; const [tp, fn, fp, tn] = P[b.dataset.p]; v = { tp, fn, fp, tn }; set(); draw(); });
  set(); draw();
}};

/* ---------- ROC ---------- */
DEMOS.roc = { hint: 'Déplace le seuil T : le point bouge sur la courbe. Change la séparation : c\'est la courbe entière qui change.', mount(el) {
  el.innerHTML = slider('roc-t', 'Seuil T', -3, 6, 0.05, 1.2) + slider('roc-d', 'Séparation des classes', 0, 4, 0.05, 2) + slider('roc-p', 'Proportion de malades', 0.01, 0.5, 0.01, 0.2) +
    `<svg class="plot" viewBox="0 0 640 230" data-h style="margin-top:8px"></svg>
    <div class="grid2" style="margin-top:14px"><svg class="plot" viewBox="0 0 300 290" data-r></svg><div><div class="tbl-wrap" data-cm></div><div class="metrics" style="margin-top:10px" data-m></div></div></div>`;
  const st = { t: 1.2, d: 2, p: 0.2 };
  const draw = () => {
    const { t, d, p } = st, W = 640, H = 230, m = { l: 20, r: 10, t: 14, b: 32 };
    const sx = lin(-4, 8, m.l, W - m.r), sy = lin(0, 0.45, H - m.b, m.t);
    const area = (mu, a, b) => { const pts = [[sx(a), sy(0)]]; for (let x = a; x <= b + 1e-9; x += 0.04) pts.push([sx(x), sy(gpdf(x, mu))]); pts.push([sx(b), sy(0)]); return pathOf(pts) + 'Z'; };
    const line = mu => { const pts = []; for (let x = -4; x <= 8; x += 0.04) pts.push([sx(x), sy(gpdf(x, mu))]); return pathOf(pts); };
    let s = axesSVG({ W, H, m, sx, sy, xt: [-4, -2, 0, 2, 4, 6, 8], yt: [], xlab: 'score X donné par le classifier (ex. globules blancs)' });
    s += `<path d="${area(0, -4, t)}" fill="var(--neg)" opacity=".18"/><path d="${area(0, t, 8)}" fill="var(--neg)" opacity=".55"/>`;
    s += `<path d="${area(d, -4, t)}" fill="var(--pos)" opacity=".18"/><path d="${area(d, t, 8)}" fill="var(--pos)" opacity=".5"/>`;
    s += `<path d="${line(0)}" fill="none" stroke="var(--neg)" stroke-width="2"/><path d="${line(d)}" fill="none" stroke="var(--pos)" stroke-width="2"/>`;
    s += `<line x1="${sx(t)}" x2="${sx(t)}" y1="${m.t - 6}" y2="${H - m.b}" stroke="var(--ink)" stroke-width="2"/><text x="${sx(t)}" y="${m.t - 2}" text-anchor="middle" class="t-ink" style="font-size:12px">T</text>`;
    s += `<text x="${sx(-2.6)}" y="${sy(0.3)}" style="fill:var(--neg);font-size:12px">sains · f₀</text><text x="${sx(d + 1.2)}" y="${sy(0.3)}" style="fill:var(--pos);font-size:12px">malades · f₁</text>`;
    s += `<text x="${sx(t) - 6}" y="${m.t + 10}" text-anchor="end" class="t-ink">← prédit −1</text><text x="${sx(t) + 6}" y="${m.t + 10}" class="t-ink">prédit +1 →</text>`;
    $('[data-h]', el).innerHTML = s;
    // ROC
    const TPR = 1 - Phi(t - d), FPR = 1 - Phi(t), AUC = Phi(d / Math.SQRT2);
    const R = 300, rm = { l: 40, r: 12, t: 12, b: 36 }, rx = lin(0, 1, rm.l, R - rm.r), ry = lin(0, 1, 290 - rm.b, rm.t);
    const pts = []; for (let T = 9; T >= -6; T -= 0.05) pts.push([rx(1 - Phi(T)), ry(1 - Phi(T - d))]);
    let r = axesSVG({ W: R, H: 290, m: rm, sx: rx, sy: ry, xt: [0, 0.5, 1], yt: [0, 0.5, 1], xlab: 'False Positive Rate', ylab: 'True Positive Rate' });
    r += `<path d="${pathOf([[rx(0), ry(0)], ...pts, [rx(1), ry(0)]])}Z" fill="var(--accent)" opacity=".12"/>`;
    r += `<path d="M${rx(0)} ${ry(0)}L${rx(1)} ${ry(1)}" stroke="var(--muted)" stroke-dasharray="4 4"/><path d="${pathOf(pts)}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
    r += `<circle cx="${rx(FPR)}" cy="${ry(TPR)}" r="7" fill="var(--hl)" stroke="var(--ink)" stroke-width="1.5"/>`;
    r += `<text x="${rx(0.55)}" y="${ry(0.12)}" class="t-ink" style="font-size:13px">AUC = ${fmt(AUC, 3)}</text><text x="${rx(0.62)}" y="${ry(0.5)}" style="font-size:10px">hasard</text>`;
    $('[data-r]', el).innerHTML = r;
    const N = 1000, np = Math.round(N * p), nn = N - np, tp = Math.round(TPR * np), fn = np - tp, fp = Math.round(FPR * nn), tn = nn - fp;
    $('[data-cm]', el).innerHTML = `<table class="cm"><tr><td colspan="2" style="border:none"></td><th>Vrai −1</th><th>Vrai +1</th></tr>
      <tr><th rowspan="2">Prédit</th><th>−1</th><td class="cell-tn"><span class="big">${tn}</span><span class="lab">TN</span></td><td class="cell-fn"><span class="big">${fn}</span><span class="lab">FN</span></td></tr>
      <tr><th>+1</th><td class="cell-fp"><span class="big">${fp}</span><span class="lab">FP</span></td><td class="cell-tp"><span class="big">${tp}</span><span class="lab">TP</span></td></tr></table><p class="small muted" style="text-align:center;margin:6px 0 0">sur ${N} patients, dont ${np} malades</p>`;
    const Pr = tp / (tp + fp);
    const row = (nm, al, val) => `<div class="metric"><span><span class="nm">${nm}</span><span class="al">${al}</span></span><span class="val">${pct(val)}</span></div>`;
    $('[data-m]', el).innerHTML = row('TPR', 'recall · sensitivity', TPR) + row('FPR', '1 − specificity', FPR) + row('Precision', 'dépend de la proportion de malades', Pr) + row('Accuracy', '', (tp + tn) / N);
  };
  bindSlider(el, 'roc-t', v => fmt(v, 2), v => { st.t = v; draw(); }).go();
  bindSlider(el, 'roc-d', v => fmt(v, 2), v => { st.d = v; draw(); }).go();
  bindSlider(el, 'roc-p', v => Math.round(v * 100) + ' %', v => { st.p = v; draw(); }).go();
}};
/* ---------- curse of dimensionality ---------- */
DEMOS.curse = { hint: '300 points tirés au hasard dans un cube [0,1]^d. On mesure leur distance à un point de référence. Augmente la dimension d.', mount(el) {
  const D = [1, 2, 3, 5, 10, 20, 50, 100, 200, 500, 1000];
  const stats = D.map((d, k) => { const r = rng(100 + k), q = Array.from({ length: d }, r);
    const ds = Array.from({ length: 300 }, () => { let s = 0; for (let j = 0; j < d; j++) { const v = r() - q[j]; s += v * v; } return Math.sqrt(s); });
    const mn = Math.min(...ds), mx = Math.max(...ds); return { d, ds, mn, mx, c: (mx - mn) / mn }; });
  el.innerHTML = slider('cu-d', 'Dimension d', 0, D.length - 1, 1, 1) + `<div class="grid2" style="margin-top:10px"><svg class="plot" viewBox="0 0 360 240" data-h></svg><svg class="plot" viewBox="0 0 360 240" data-c></svg></div><div class="stat" data-s></div>`;
  const W = 360, H = 240, m = { l: 40, r: 10, t: 12, b: 34 };
  const draw = k => {
    const S = stats[k], bins = Array(25).fill(0); S.ds.forEach(v => bins[Math.min(24, Math.floor(v / S.mx * 25))]++);
    const sx = lin(0, 1, m.l, W - m.r), sy = lin(0, Math.max(...bins) * 1.1, H - m.b, m.t);
    let s = axesSVG({ W, H, m, sx, sy, xt: [0, 0.25, 0.5, 0.75, 1], yt: [], xlab: 'distance / distance max', ylab: 'nombre de points' });
    bins.forEach((b, i) => s += `<rect x="${sx(i / 25) + 1}" y="${sy(b)}" width="${sx(1 / 25) - sx(0) - 2}" height="${H - m.b - sy(b)}" fill="var(--accent)" opacity=".75" rx="1.5"/>`);
    s += `<text x="${m.l + 6}" y="${m.t + 10}" class="t-ink">d = ${S.d}</text>`;
    $('[data-h]', el).innerHTML = s;
    const cx = lin(0, D.length - 1, m.l + 8, W - m.r - 8), cy = logsc(0.05, 1000, H - m.b, m.t);
    let c = axesSVG({ W, H, m, sx: cx, sy: cy, xt: [], yt: [0.1, 1, 10, 100, 1000], xlab: 'dimension (1 → 1000)', ylab: '(max − min) / min' });
    [0, 4, 7, 10].forEach(i => c += `<text x="${cx(i)}" y="${H - m.b + 15}" text-anchor="middle">${D[i]}</text>`);
    c += `<path d="${pathOf(stats.map((v, i) => [cx(i), cy(clamp(v.c, 0.05, 1000))]))}" fill="none" stroke="var(--pos)" stroke-width="2"/>`;
    stats.forEach((v, i) => c += `<circle cx="${cx(i)}" cy="${cy(clamp(v.c, 0.05, 1000))}" r="${i === k ? 6 : 3}" fill="${i === k ? 'var(--hl)' : 'var(--pos)'}" ${i === k ? 'stroke="var(--ink)"' : ''}/>`);
    $('[data-c]', el).innerHTML = c;

DEMOS.rank = { hint: 'Matrice clients × jours de la slide 15 (nombre d\'achats). Modifie les valeurs ou charge un exemple. Le rank se recalcule.', mount(el) {
  const days = ['Wed', 'Thu', 'Fri', 'Sat', 'Sun'], who = ['George', 'Maria', 'Ian', 'Zoe', 'Helen', 'Marc'];

   <div><div class="stat" style="margin-top:0"><div><small>Rank</small><b data-r style="font-size:28px"></b></div><div><small>Taille</small><b>6 × 5</b></div></div><svg class="plot" viewBox="0 0 300 150" data-sv style="margin-top:10px"></svg></div></div><div class="callout" data-c></div>`;

    let s = axesSVG({ W, H, m, sx: x => x, sy, yt: [0, Math.round(mx)] }) + `<text x="${m.l}" y="11">singular values σᵢ (cours suivant : SVD)</text>`;
    for (let i = 0; i < 5; i++) { const v = sv[i] || 0; s += `<rect x="${m.l + i * bw + 6}" y="${sy(v)}" width="${bw - 12}" height="${H - m.b - sy(v)}" fill="var(--accent)" rx="2"/><text x="${m.l + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle">σ${i + 1}=${fmt(v, 1)}</text>`; }

DEMOS.eigen = { hint: 'Fais tourner le vecteur u (bleu). Au (rouge) est son image par A. Quand ils sont alignés, u est un eigenvector.', mount(el) {
  let A = [[2, 1], [1, 2]];
  el.innerHTML = `<div class="row" style="margin-bottom:10px"><span class="small">A =</span><span class="matedit" style="grid-template-columns:repeat(2,auto)"><input id="eg-a" type="number" step="0.5"><input id="eg-b" type="number" step="0.5"><input id="eg-b2" type="number" disabled><input id="eg-d" type="number" step="0.5"></span><span class="small muted">symétrique : le coin bas-gauche suit le coin haut-droit</span></div>` +
    slider('eg-th', 'Angle de u', 0, 180, 0.5, 20) + `<div class="row" style="margin:6px 0 10px"><button class="btn sm" data-g="0">Aller sur u₁</button><button class="btn sm" data-g="1">Aller sur u₂</button></div>
    <div class="grid2"><svg class="plot" viewBox="0 0 320 320" data-p></svg><div data-s></div></div>`;
  const W = 320, c = 160; let th = 20, eg;
  const inputs = () => { $('#eg-a', el).value = A[0][0]; $('#eg-b', el).value = A[0][1]; $('#eg-b2', el).value = A[1][0]; $('#eg-d', el).value = A[1][1]; };
  $$('.matedit input', el).forEach(i => i.style.cssText = 'width:54px;text-align:center;font-family:var(--f-mono);border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:3px 0');
  const draw = () => {
    eg = jacobi(A); const sc = 150 / Math.max(1.2, Math.abs(eg.vals[0]), Math.abs(eg.vals[1]), 1) * 0.9;
    const u = [Math.cos(th * Math.PI / 180), Math.sin(th * Math.PI / 180)], Au = [A[0][0] * u[0] + A[0][1] * u[1], A[1][0] * u[0] + A[1][1] * u[1]];
    const P = v => [c + v[0] * sc, c - v[1] * sc];
    let s = `<line x1="0" x2="${W}" y1="${c}" y2="${c}" class="grid"/><line y1="0" y2="${W}" x1="${c}" x2="${c}" class="grid"/>`;
    const el2 = []; for (let a = 0; a <= 360; a += 4) { const v = [Math.cos(a * Math.PI / 180), Math.sin(a * Math.PI / 180)]; el2.push(P([A[0][0] * v[0] + A[0][1] * v[1], A[1][0] * v[0] + A[1][1] * v[1]])); }
    s += `<path d="${pathOf(el2)}Z" fill="var(--accent-soft)" stroke="var(--line)"/><circle cx="${c}" cy="${c}" r="${sc}" fill="none" stroke="var(--muted)" stroke-dasharray="3 4"/>`;
    eg.vecs.forEach(v => { const a = P(v.map(x => x * 3)), b = P(v.map(x => -x * 3)); s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--ok)" stroke-dasharray="6 5" stroke-width="1.2"/>`; });
    const arrow = (v, col, w) => { const [x, y] = P(v), ang = Math.atan2(y - c, x - c), h = 9; return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="${col}" stroke-width="${w}"/><path d="M${x} ${y}L${x - h * Math.cos(ang - 0.4)} ${y - h * Math.sin(ang - 0.4)}L${x - h * Math.cos(ang + 0.4)} ${y - h * Math.sin(ang + 0.4)}Z" fill="${col}"/>`; };
    s += arrow(Au, 'var(--pos)', 3) + arrow(u, 'var(--accent)', 3);
    const [ux, uy] = P(u), [ax, ay] = P(Au); s += `<text x="${ux + 6}" y="${uy - 6}" style="fill:var(--accent);font-size:13px">u</text><text x="${ax + 6}" y="${ay - 6}" style="fill:var(--pos);font-size:13px">Au</text>`;
    $('[data-p]', el).innerHTML = s;
    const cross = u[0] * Au[1] - u[1] * Au[0], dot = u[0] * Au[0] + u[1] * Au[1], ang = Math.abs(Math.atan2(cross, dot) * 180 / Math.PI), angl = Math.min(ang, 180 - ang), al = angl < 1.2;
    $('[data-s]', el).innerHTML = `<div class="metrics"><div class="metric"><span class="nm">u</span><span class="calc mono">[${fmt(u[0])}, ${fmt(u[1])}]</span></div><div class="metric"><span class="nm">Au</span><span class="calc mono">[${fmt(Au[0])}, ${fmt(Au[1])}]</span></div><div class="metric"><span class="nm">Angle entre u et Au</span><span class="val">${fmt(angl, 1)}°</span></div></div>
      <div class="callout ${al ? 'ok' : ''}">${al ? `<b>Aligné !</b> Au = ${fmt(dot, 2)} · u. Donc u est un eigenvector, d'eigenvalue λ = ${fmt(dot, 2)}.` : 'Au n\'a pas la même direction que u : A fait tourner u. Ce n\'est pas un eigenvector.'}</div>
      <p class="small muted" style="margin-top:10px">Eigenvalues de A : <b class="mono">λ₁ = ${fmt(eg.vals[0])}</b>, <b class="mono">λ₂ = ${fmt(eg.vals[1])}</b>. Les pointillés verts sont les deux eigenvectors, perpendiculaires car A est symétrique. Le cercle (tous les u de norme 1) devient une ellipse ; ses axes sont les eigenvectors.</p>`;
  };
  const sl = bindSlider(el, 'eg-th', v => v + '°', v => { th = v; draw(); });
  el.addEventListener('input', e => { if (!['eg-a', 'eg-b', 'eg-d'].includes(e.target.id)) return; A = [[+$('#eg-a', el).value || 0, +$('#eg-b', el).value || 0], [+$('#eg-b', el).value || 0, +$('#eg-d', el).value || 0]]; $('#eg-b2', el).value = A[1][0]; draw(); });
  el.addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (!b) return; const v = eg.vecs[+b.dataset.g]; let a = Math.atan2(v[1], v[0]) * 180 / Math.PI; if (a < 0) a += 180; if (a > 180) a -= 180; sl.set(Math.round(a * 2) / 2); });
  inputs(); sl.go();
}};

/* ---------- SVD (users × movies) ---------- */
const MOVIES = ['Matrix', 'Alien', 'Serenity', 'Casablanca', 'Amélie'];
const SVD_A = {
  simple: [[1, 1, 1, 0, 0], [3, 3, 3, 0, 0], [4, 4, 4, 0, 0], [5, 5, 5, 0, 0], [0, 0, 0, 4, 4], [0, 0, 0, 5, 5], [0, 0, 0, 2, 2]],
  real: [[1, 1, 1, 0, 0], [3, 3, 3, 0, 0], [4, 4, 4, 0, 0], [5, 5, 5, 0, 0], [0, 2, 0, 4, 4], [0, 0, 0, 5, 5], [0, 1, 0, 2, 2]],
};
const CNAME = ['SciFi', 'Romance', 'bruit'];
DEMOS.svd = { hint: 'Exemple des slides 33–41. Clique sur un concept pour voir sa contribution σᵢ uᵢ vᵢᵀ à la matrice.', mount(el) {
  let which = 'real', ci = 0;
  el.innerHTML = `<div class="row" style="margin-bottom:12px"><div class="seg" data-w><button data-v="simple">Matrice simple</button><button data-v="real">Matrice réaliste</button></div></div>
    <div class="row" style="margin-bottom:10px" data-cb></div><div class="mrow" data-m></div><div class="callout" data-c></div>
    <div class="blk" style="margin-top:16px"><div class="eyebrow" style="margin-bottom:6px" data-rt></div><div class="mrow" data-r1></div></div>`;
  const draw = () => {
    const A = SVD_A[which], S = svd(A), r = S.s.length; ci = Math.min(ci, r - 1);
    $$('[data-w] button', el).forEach(b => b.classList.toggle('on', b.dataset.v === which));
    $('[data-cb]', el).innerHTML = S.s.map((s, i) => `<button class="btn sm ${i === ci ? 'pri' : ''}" data-c="${i}">Concept ${i + 1} · ${CNAME[i]} · σ = ${fmt(s, 1)}</button>`).join('');
    const U = Tr(S.U), Sig = S.s.map((s, i) => S.s.map((_, j) => i === j ? s : 0)), Vt = S.V;
    $('[data-m]', el).innerHTML = matHTML(A, { d: 0, heat: true, cap: 'A : users × ' + MOVIES.join(', ') }) + '<span class="op">=</span>' +
      matHTML(U, { heat: true, hl: (_, c) => c === ci, cap: 'U : user-to-concept' }) + '<span class="op">×</span>' +
      matHTML(Sig, { d: 1, heat: true, hl: (a, b) => a === ci && b === ci, cap: 'Σ : force' }) + '<span class="op">×</span>' +
      matHTML(Vt, { heat: true, hl: rr => rr === ci, cap: 'Vᵀ : movie-to-concept' });
    const u = S.U[ci], v = S.V[ci], top = v.map((x, j) => [x, MOVIES[j]]).sort((a, b) => Math.abs(b[0]) - Math.abs(a[0])).slice(0, 3).map(x => x[1]);
    const msg = ci === 0 ? `Le concept 1 a la plus grande force (σ₁ = ${fmt(S.s[0], 1)}). Dans Vᵀ, il pèse surtout sur ${top.join(', ')} : c'est le concept <b>SciFi</b>. Dans U, ce sont les 4 premiers users qui l'aiment.`
      : ci === 1 ? `Le concept 2 (σ₂ = ${fmt(S.s[1], 1)}) pèse sur Casablanca et Amélie : c'est le concept <b>Romance</b>, porté par les 3 derniers users.`
      : `Le concept 3 a une force de seulement ${fmt(S.s[2], 1)} : il capte le bruit (les notes « parasites » des users 5 et 7 sur Alien). C'est lui qu'on jettera pour réduire la dimension.`;
    $('[data-c]', el).innerHTML = msg + (which === 'simple' ? ' <br>Avec la matrice simple, il n\'y a que 2 concepts : rank = 2.' : '');
    const R1 = u.map(a => v.map(b => S.s[ci] * a * b));
    $('[data-rt]', el).textContent = `Contribution du concept ${ci + 1} : σ${ci + 1} · u${ci + 1} · v${ci + 1}ᵀ`;
    $('[data-r1]', el).innerHTML = matHTML(R1, { d: 1, heat: true, max: 5, cap: `rank 1 · A = la somme de ces ${r} matrices` });
  };
  el.addEventListener('click', e => { const w = e.target.closest('[data-v]'); if (w) { which = w.dataset.v; draw(); return; } const b = e.target.closest('[data-c]'); if (b && b.tagName === 'BUTTON') { ci = +b.dataset.c; draw(); } });
  draw();
}};

DEMOS.lowrank = { hint: 'On garde seulement les k plus grandes singular values. Compare A et sa reconstruction A_k.', mount(el) {
  const A = SVD_A.real, S = svd(A), tot = S.s.reduce((a, s) => a + s * s, 0);
  el.innerHTML = slider('lr-k', 'k (concepts gardés)', 1, S.s.length, 1, 2) + `<svg class="plot" viewBox="0 0 640 64" data-e style="margin:8px 0 12px"></svg><div class="mrow" data-m></div><div class="stat" data-s></div><div class="callout" data-c></div>`;
  const draw = k => {
    const Ak = A.map((_, i) => A[0].map((_, j) => S.s.slice(0, k).reduce((t, s, c) => t + s * S.U[c][i] * S.V[c][j], 0)));
    const E = A.map((r, i) => r.map((v, j) => v - Ak[i][j])), fro = Math.sqrt(E.flat().reduce((a, v) => a + v * v, 0)), kept = S.s.slice(0, k).reduce((a, s) => a + s * s, 0) / tot;
    let x = 10, s = ''; S.s.forEach((sv, i) => { const w = sv * sv / tot * 620; s += `<rect x="${x}" y="8" width="${Math.max(w - 2, 1)}" height="26" rx="3" fill="${i < k ? 'var(--accent)' : 'var(--line)'}"/>`; if (w > 60) s += `<text x="${x + 6}" y="26" style="fill:${i < k ? 'var(--accent-ink)' : 'var(--muted)'}">σ${i + 1}² = ${fmt(sv * sv, 1)}</text>`; x += w; });
    s += `<text x="10" y="54">energy gardée : ${pct(kept)} · règle : garder 80–90 %</text>`;
    $('[data-e]', el).innerHTML = s;
    $('[data-m]', el).innerHTML = matHTML(A, { d: 0, heat: true, max: 5, cap: 'A (original)' }) + '<span class="op">≈</span>' + matHTML(Ak, { d: 2, heat: true, max: 5, cap: `A_${k} (rank ${k})` }) + '<span class="op">→</span>' + matHTML(E, { d: 2, heat: true, max: 5, cap: 'erreur A − A_k' });
    $('[data-s]', el).innerHTML = `<div><small>Energy gardée</small><b>${pct(kept)}</b></div><div><small>‖A − A_k‖_F</small><b>${fmt(fro, 2)}</b></div><div><small>√(σ²ₖ₊₁ + …)</small><b>${fmt(Math.sqrt(S.s.slice(k).reduce((a, s) => a + s * s, 0)), 2)}</b></div><div><small>Nombres stockés</small><b>${k * (7 + 5 + 1)} au lieu de 35</b></div>`;
    $('[data-c]', el).innerHTML = k === 1 ? 'Avec k = 1, on ne garde que SciFi : les fans de Romance sont reconstruits presque à 0. Environ 63 % de l\'energy, ce n\'est pas assez.' : k === 2 ? 'Avec k = 2 (SciFi + Romance), 99 % de l\'energy et une reconstruction très proche (slide 52). C\'est le bon choix : le 3ᵉ concept n\'est que du bruit.' : 'Avec tous les concepts, la reconstruction est exacte, mais on ne compresse plus rien.';
  };
  bindSlider(el, 'lr-k', v => v, draw).go();
}};

/* ---------- PCA ---------- */
DEMOS.pca = { hint: 'Fais tourner la direction w et cherche celle qui maximise la variance des projections. Puis teste l\'effet de l\'échelle.', mount(el) {
  const r = rng(9), base = Array.from({ length: 70 }, () => { const a = randn(r) * 1.6, b = randn(r) * 0.55, t = 0.6; return [a * Math.cos(t) - b * Math.sin(t), a * Math.sin(t) + b * Math.cos(t)]; });
  let th = 100, scale = 1, stdz = false;
  el.innerHTML = slider('pc-th', 'Direction de w', 0, 180, 1, 100) + `<div class="row" style="margin:6px 0 12px"><button class="btn sm pri" data-pc1>Trouver PC1</button><div class="seg" data-sc><button data-v="1">x₁ × 1</button><button data-v="5">x₁ × 5</button></div><label class="row small" style="gap:6px"><input type="checkbox" id="pc-std"> Standardiser</label></div>
    <div class="grid2"><svg class="plot" viewBox="0 0 340 340" data-p></svg><div data-s></div></div>`;
  let st;
  const prep = () => {
    let X = base.map(([a, b]) => [a * scale, b]); const mu = [0, 1].map(j => X.reduce((s, p) => s + p[j], 0) / X.length);
    X = X.map(p => [p[0] - mu[0], p[1] - mu[1]]);
    if (stdz) { const sd = [0, 1].map(j => Math.sqrt(X.reduce((s, p) => s + p[j] ** 2, 0) / X.length)); X = X.map(p => [p[0] / sd[0], p[1] / sd[1]]); }
    const C = [[0, 0], [0, 0]]; X.forEach(p => { C[0][0] += p[0] * p[0]; C[0][1] += p[0] * p[1]; C[1][1] += p[1] * p[1]; }); C[1][0] = C[0][1];
    const n = X.length, eg = jacobi(C.map(r => r.map(v => v / n))); st = { X, eg };
  };
  const draw = () => {
    const { X, eg } = st, n = X.length, w = [Math.cos(th * Math.PI / 180), Math.sin(th * Math.PI / 180)];
    const z = X.map(p => p[0] * w[0] + p[1] * w[1]), vz = z.reduce((s, v) => s + v * v, 0) / n, tot = eg.vals[0] + eg.vals[1];
    const R = Math.max(...X.flat().map(Math.abs)) * 1.1, W = 340, s0 = lin(-R, R, 14, W - 14), sy = lin(-R, R, W - 14, 14);
    let s = `<line x1="${s0(-R)}" x2="${s0(R)}" y1="${sy(0)}" y2="${sy(0)}" class="grid"/><line y1="${sy(-R)}" y2="${sy(R)}" x1="${s0(0)}" x2="${s0(0)}" class="grid"/>`;
    s += `<text x="${W - 16}" y="${sy(0) - 5}" text-anchor="end">x₁${scale > 1 ? ' (×5)' : ''}</text><text x="${s0(0) + 5}" y="22">x₂</text>`;
    const L = R * 1.6; s += `<line x1="${s0(-w[0] * L)}" y1="${sy(-w[1] * L)}" x2="${s0(w[0] * L)}" y2="${sy(w[1] * L)}" stroke="var(--hl)" stroke-width="3"/>`;
    X.forEach((p, i) => { const q = [z[i] * w[0], z[i] * w[1]]; s += `<line x1="${s0(p[0])}" y1="${sy(p[1])}" x2="${s0(q[0])}" y2="${sy(q[1])}" stroke="var(--muted)" opacity=".25"/>`; });
    X.forEach(p => s += `<circle cx="${s0(p[0])}" cy="${sy(p[1])}" r="3.2" fill="var(--accent)" opacity=".8"/>`);
    z.forEach(v => s += `<circle cx="${s0(v * w[0])}" cy="${sy(v * w[1])}" r="2.6" fill="var(--pos)"/>`);
    eg.vecs.forEach((v, i) => { const l = Math.sqrt(eg.vals[i]) * 2; s += `<line x1="${s0(0)}" y1="${sy(0)}" x2="${s0(v[0] * l)}" y2="${sy(v[1] * l)}" stroke="var(--ok)" stroke-width="2" stroke-dasharray="5 3"/><text x="${s0(v[0] * l) + 4}" y="${sy(v[1] * l) - 4}" style="fill:var(--ok)">PC${i + 1}</text>`; });
    $('[data-p]', el).innerHTML = s;
    const ratio = vz / eg.vals[0], pc1 = Math.atan2(eg.vecs[0][1], eg.vecs[0][0]) * 180 / Math.PI;
    $('[data-s]', el).innerHTML = `<div class="metrics"><div class="metric"><span><span class="nm">Variance projetée sur w</span><span class="al">Var(z) = wᵀΣw</span></span><span class="val">${fmt(vz)}</span></div>
      <div class="metric"><span><span class="nm">λ₁ (maximum possible)</span><span class="al">atteint quand w = PC1</span></span><span class="val">${fmt(eg.vals[0])}</span></div>
      <div class="metric"><span><span class="nm">λ₂</span><span class="al">variance sur PC2</span></span><span class="val">${fmt(eg.vals[1])}</span></div>
      <div class="metric"><span><span class="nm">Variance expliquée par PC1</span><span class="al">λ₁ / (λ₁ + λ₂)</span></span><span class="val">${pct(eg.vals[0] / tot)}</span></div></div>
      <div class="bar" style="margin-top:12px;height:10px"><i style="width:${ratio * 100}%;background:var(--hl)"></i></div><p class="small muted" style="margin:6px 0 0">w capte ${pct(ratio, 0)} de la variance maximale.</p>
      <div class="callout ${ratio > 0.995 ? 'ok' : ''}">${ratio > 0.995 ? '<b>Trouvé.</b> w est le 1er principal axis : l\'eigenvector de Σ qui a la plus grande eigenvalue.' : scale > 1 && !stdz ? 'x₁ est 5 fois plus étalée : PC1 se colle presque à l\'axe x₁. Coche « Standardiser » pour corriger.' : 'Points bleus = données centrées. Points rouges = leurs projections sur la droite jaune. On cherche la droite où les points rouges sont les plus étalés.'}</div>`;
    st.pc1 = ((pc1 % 180) + 180) % 180;
  };
  const sl = bindSlider(el, 'pc-th', v => v + '°', v => { th = v; draw(); });
  const seg = () => $$('[data-sc] button', el).forEach(b => b.classList.toggle('on', +b.dataset.v === scale));
  el.addEventListener('click', e => { const b = e.target.closest('[data-sc] button'); if (b) { scale = +b.dataset.v; seg(); prep(); draw(); } if (e.target.closest('[data-pc1]')) sl.set(Math.round(st.pc1)); });
  $('#pc-std', el).addEventListener('change', e => { stdz = e.target.checked; prep(); draw(); });
  seg(); prep(); sl.go();
}};

/* ---------- PCA pas à pas ---------- */
DEMOS.pcasteps = { hint: 'Un mini-dataset de 5 points et 2 features. Avance étape par étape : c\'est exactement le calcul qu\'on peut te demander à la main.', mount(el) {
  const X = [[2, 1], [3, 4], [5, 3], [6, 6], [9, 6]], m = X.length;
  const mu = [0, 1].map(j => X.reduce((s, p) => s + p[j], 0) / m), C = X.map(p => [p[0] - mu[0], p[1] - mu[1]]), S = mm(Tr(C), C), eg = jacobi(S);
  const U = eg.vecs.map(signFix), Z = C.map(p => p[0] * U[0][0] + p[1] * U[0][1]);
  const steps = ['1. Données X', '2. Centrer', '3. Σ = CᵀC', '4. Eigen', '5. Projeter'];
  let k = 0;

  const draw = () => {
    $$('[data-st] button', el).forEach((b, i) => b.classList.toggle('on', i === k));
    const T = [
      `<p>m = 5 observations, n = 2 features.</p><div class="mrow">${matHTML(X, { d: 0, cap: 'X (5 × 2)' })}</div>`,
      `<p>Moyenne de chaque colonne : M = [${mu.join(', ')}]. On la retire à chaque ligne.</p><div class="mrow">${matHTML(X, { d: 0, cap: 'X' })}<span class="op">−</span>${matHTML([mu], { d: 0, cap: 'M' })}<span class="op">=</span>${matHTML(C, { d: 0, cap: 'C (centrée)' })}</div>`,
      `<p>Σ = CᵀC. Diagonale = Σ des carrés de chaque colonne ; hors diagonale = Σ des produits x₁·x₂.</p><div class="mrow">${matHTML(S, { d: 0, cap: 'Σ = CᵀC (2 × 2)' })}</div><p class="small muted">Ex. : Σ₁₁ = 9 + 4 + 0 + 1 + 16 = 30 ; Σ₁₂ = 9 + 0 + 0 + 2 + 8 = 19.</p>`,
      `<p>On résout det(Σ − λI) = 0 :</p><div class="fblock">λ = (30 + 18)/2 ± √(((30 − 18)/2)² + 19²) = 24 ± ${fmt(Math.sqrt(36 + 361), 3)}</div><div class="mrow">${matHTML([eg.vals], { cap: 'λ₁, λ₂' })}${matHTML(Tr(U), { d: 3, cap: 'U : eigenvectors en colonnes' })}</div><p>Variance expliquée par PC1 : ${fmt(eg.vals[0], 2)} / ${fmt(eg.vals[0] + eg.vals[1], 2)} = <b>${pct(eg.vals[0] / (eg.vals[0] + eg.vals[1]))}</b> ≥ 85 % → on garde <b>k = 1</b>.</p>`,
      `<p>Principal components = C · u₁ : chaque point est maintenant décrit par <b>un seul nombre</b>.</p><div class="mrow">${matHTML(C, { d: 0, cap: 'C' })}<span class="op">×</span>${matHTML(U[0].map(v => [v]), { d: 3, cap: 'u₁' })}<span class="op">=</span>${matHTML(Z.map(v => [v]), { cap: 'z (5 × 1)' })}</div>`,
    ][k];
    $('[data-t]', el).innerHTML = T;
    const W = 300, H = 260, mg = { l: 30, r: 10, t: 10, b: 26 }, P = k === 0 ? X : C;
    const sx = k === 0 ? lin(0, 10, mg.l, W - mg.r) : lin(-5, 5, mg.l, W - mg.r), sy = k === 0 ? lin(0, 7.7, H - mg.b, mg.t) : lin(-3.85, 3.85, H - mg.b, mg.t);
    let s = axesSVG({ W, H, m: mg, sx, sy, xt: k === 0 ? [0, 5, 10] : [-4, 0, 4], yt: k === 0 ? [0, 3, 6] : [-3, 0, 3] });
    if (k >= 1) s += `<line x1="${sx(-5)}" x2="${sx(5)}" y1="${sy(0)}" y2="${sy(0)}" class="ax" opacity=".4"/><line y1="${sy(-3.85)}" y2="${sy(3.85)}" x1="${sx(0)}" x2="${sx(0)}" class="ax" opacity=".4"/>`;
    if (k >= 3) U.forEach((u, i) => s += `<line x1="${sx(-u[0] * 6)}" y1="${sy(-u[1] * 6)}" x2="${sx(u[0] * 6)}" y2="${sy(u[1] * 6)}" stroke="${i ? 'var(--muted)' : 'var(--hl)'}" stroke-width="${i ? 1.2 : 3}" ${i ? 'stroke-dasharray="4 4"' : ''}/><text x="${sx(u[0] * 4.2) + 4}" y="${sy(u[1] * 4.2) - 4}">${i ? 'u₂' : 'u₁'}</text>`);
    if (k === 4) C.forEach((p, i) => { const q = [Z[i] * U[0][0], Z[i] * U[0][1]]; s += `<line x1="${sx(p[0])}" y1="${sy(p[1])}" x2="${sx(q[0])}" y2="${sy(q[1])}" stroke="var(--muted)" stroke-dasharray="2 2"/><circle cx="${sx(q[0])}" cy="${sy(q[1])}" r="4" fill="var(--pos)"/>`; });
    P.forEach((p, i) => s += `<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="5" fill="var(--accent)"/><text x="${sx(p[0]) + 7}" y="${sy(p[1]) + 4}">${i + 1}</text>`);
    if (k === 0) s += `<text x="${sx(mu[0]) + 6}" y="${sy(mu[1]) - 6}" style="fill:var(--pos)">moyenne</text><circle cx="${sx(mu[0])}" cy="${sy(mu[1])}" r="4" fill="none" stroke="var(--pos)" stroke-width="2"/>`;
    $('[data-p]', el).innerHTML = s;
    $('[data-prev]', el).disabled = k === 0; $('[data-next]', el).hidden = k === 4;
  };
  el.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) { k = +b.dataset.i; draw(); } if (e.target.closest('[data-next]')) { k = Math.min(4, k + 1); draw(); } if (e.target.closest('[data-prev]')) { k = Math.max(0, k - 1); draw(); } });
  draw();
}};

/* ---------- Isomap / geodesic ---------- */
DEMOS.isomap = { hint: 'Coupe 2D d\'un Swiss roll. Clique sur deux points. La ligne rouge est la distance euclidienne, le chemin jaune la distance géodésique (shortest path dans le kNN graph).', mount(el) {
  const r = rng(5), P = []; const N = 95;
  for (let i = 0; i < N; i++) { const t = 1.5 * Math.PI + 3 * Math.PI * i / (N - 1); P.push([t * Math.cos(t) + (r() - 0.5) * 0.4, t * Math.sin(t) + (r() - 0.5) * 0.4]); }
  let A = 4, B = 52, k = 5;
  el.innerHTML = slider('is-k', 'k (voisins du kNN graph)', 2, 16, 1, 5) + `<div class="grid2" style="margin-top:10px"><svg class="plot" viewBox="0 0 340 340" data-p style="cursor:crosshair"></svg><div data-s></div></div>`;
  const d = (a, b) => Math.hypot(P[a][0] - P[b][0], P[a][1] - P[b][1]);
  const W = 340, sx = lin(-15, 15, 10, W - 10), sy = lin(-15, 15, W - 10, 10);
  const draw = () => {
    const nb = P.map((_, i) => P.map((_, j) => j).filter(j => j !== i).sort((a, b) => d(i, a) - d(i, b)).slice(0, k));
    const adj = P.map(() => new Map()); nb.forEach((l, i) => l.forEach(j => { adj[i].set(j, d(i, j)); adj[j].set(i, d(i, j)); }));
    const dist = Array(N).fill(Infinity), prev = Array(N).fill(-1), done = Array(N).fill(false); dist[A] = 0;
    for (let it = 0; it < N; it++) { let u = -1; for (let i = 0; i < N; i++) if (!done[i] && (u < 0 || dist[i] < dist[u])) u = i; if (u < 0 || dist[u] === Infinity) break; done[u] = true; adj[u].forEach((w, v) => { if (dist[u] + w < dist[v]) { dist[v] = dist[u] + w; prev[v] = u; } }); }
    const path = []; if (dist[B] < Infinity) for (let v = B; v >= 0; v = prev[v]) path.push(v);
    let s = ''; adj.forEach((m, i) => m.forEach((_, j) => { if (i < j) s += `<line x1="${sx(P[i][0])}" y1="${sy(P[i][1])}" x2="${sx(P[j][0])}" y2="${sy(P[j][1])}" stroke="var(--muted)" opacity=".3"/>`; }));
    s += `<path d="${pathOf(path.map(i => [sx(P[i][0]), sy(P[i][1])]))}" fill="none" stroke="var(--hl)" stroke-width="4" stroke-linejoin="round"/>`;
    s += `<line x1="${sx(P[A][0])}" y1="${sy(P[A][1])}" x2="${sx(P[B][0])}" y2="${sy(P[B][1])}" stroke="var(--pos)" stroke-width="2" stroke-dasharray="6 4"/>`;
    P.forEach((p, i) => s += `<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="${i === A || i === B ? 7 : 3.4}" fill="${i === A || i === B ? 'var(--ink)' : 'var(--accent)'}" data-i="${i}"/>`);
    s += `<text x="${sx(P[A][0]) + 9}" y="${sy(P[A][1]) + 4}" class="t-ink">A</text><text x="${sx(P[B][0]) + 9}" y="${sy(P[B][1]) + 4}" class="t-ink">B</text>`;
    $('[data-p]', el).innerHTML = s;
    const eu = d(A, B), ge = dist[B], ratio = ge / eu;
    const short = ratio < 1.6 && Math.abs(A - B) > 30;
    $('[data-s]', el).innerHTML = `<div class="metrics"><div class="metric"><span><span class="nm" style="color:var(--pos)">Distance euclidienne</span><span class="al">ce que voient PCA et MDS classique</span></span><span class="val">${fmt(eu, 1)}</span></div>
      <div class="metric"><span><span class="nm" style="color:var(--warn)">Distance géodésique</span><span class="al">shortest path dans le kNN graph (Isomap)</span></span><span class="val">${ge < Infinity ? fmt(ge, 1) : '∞'}</span></div>
      <div class="metric"><span><span class="nm">Rapport</span><span class="al">géodésique / euclidienne</span></span><span class="val">${ge < Infinity ? '×' + fmt(ratio, 1) : '—'}</span></div></div>
      <div class="callout ${short || ge === Infinity ? '' : 'ok'}">${ge === Infinity ? 'Avec si peu de voisins, le graph est coupé en morceaux : pas de chemin entre A et B.' : short ? '<b>Court-circuit.</b> Avec k trop grand, des arêtes sautent d\'une couche du rouleau à l\'autre et la géodésique ne suit plus la surface. Le choix de k compte.' : 'A et B sont proches « à vol d\'oiseau », mais très loin le long de la spirale. Isomap garde cette distance-là, puis applique MDS pour « dérouler » le rouleau.'}</div>`;
  };
  let pickA = false;
  $('[data-p]', el).addEventListener('click', e => { const svg = e.currentTarget, pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse());
    let best = 0, bd = Infinity; P.forEach((p, i) => { const dd = Math.hypot(sx(p[0]) - q.x, sy(p[1]) - q.y); if (dd < bd) { bd = dd; best = i; } });
    if (pickA) A = best; else B = best; pickA = !pickA; draw(); });
  bindSlider(el, 'is-k', v => v, v => { k = v; draw(); }).go();
}};

/* ---------- feature selection ---------- */
DEMOS.fsel = { hint: 'À gauche : pourquoi on ne teste pas tous les sous-ensembles. À droite : calcule un χ² sur une table 2 × 2.', mount(el) {
  el.innerHTML = `<div class="grid2"><div>${slider('fs-n', 'Nombre de features n', 1, 60, 1, 20)}<div data-c></div></div>
    <div><p class="small" style="margin-top:0">Feature A = « l'email contient le mot <i>gratuit</i> ». Classe C = spam ou non. Modifie les effectifs observés O<sub>ij</sub>.</p>
    <div class="tbl-wrap"><table class="cm"><tr><td style="border:none"></td><th>Spam</th><th>Pas spam</th></tr>
    <tr><th>Contient « gratuit »</th><td><input id="fs-a" type="number" min="0" value="40"></td><td><input id="fs-b" type="number" min="0" value="10"></td></tr>
    <tr><th>Ne contient pas</th><td><input id="fs-c" type="number" min="0" value="60"></td><td><input id="fs-d" type="number" min="0" value="190"></td></tr></table></div><div data-x></div></div></div>`;
  $$('input[type=number]', el).forEach(i => i.style.cssText = 'width:64px;text-align:center;font-family:var(--f-mono);border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:3px 0');
  const human = s => s < 60 ? fmt(s, 0) + ' s' : s < 3600 ? fmt(s / 60, 0) + ' min' : s < 86400 ? fmt(s / 3600, 1) + ' h' : s < 3.15e7 ? fmt(s / 86400, 0) + ' jours' : (s / 3.15e7 < 1e6 ? fmt(s / 3.15e7, 0) : (s / 3.15e7).toExponential(1)) + ' ans';
  const drawN = n => {
    const ex = 2 ** n, fw = n * (n + 1) / 2;
    $('[data-c]', el).innerHTML = `<div class="metrics" style="margin-top:10px"><div class="metric"><span><span class="nm">Recherche exhaustive</span><span class="al">2ⁿ sous-ensembles</span></span><span class="calc">${ex > 1e9 ? ex.toExponential(2) : ex.toLocaleString('fr-FR')}<span class="val">${human(ex)}</span></span></div>
      <div class="metric"><span><span class="nm">Forward search</span><span class="al">≈ n(n+1)/2 entraînements, O(n²·T)</span></span><span class="calc">${fw.toLocaleString('fr-FR')}<span class="val">${human(fw)}</span></span></div></div>
      <p class="small muted">En supposant 1 seconde par entraînement (T = 1 s).</p>`;
  };
  const drawX = () => {
    const O = [[+$('#fs-a', el).value || 0, +$('#fs-b', el).value || 0], [+$('#fs-c', el).value || 0, +$('#fs-d', el).value || 0]];
    const m = O.flat().reduce((a, b) => a + b, 0) || 1, ri = O.map(r => r[0] + r[1]), cj = [O[0][0] + O[1][0], O[0][1] + O[1][1]];
    const E = ri.map(a => cj.map(b => a * b / m)); let x2 = 0; O.forEach((r, i) => r.forEach((o, j) => { if (E[i][j] > 0) x2 += (o - E[i][j]) ** 2 / E[i][j]; }));
    $('[data-x]', el).innerHTML = `<p class="small" style="margin:10px 0 4px">Effectifs attendus si indépendance : E<sub>ij</sub> = (total ligne i × total colonne j) / m</p><div class="mrow">${matHTML(E, { d: 1, cap: 'E (attendus)' })}</div>
      <div class="stat"><div><small>χ²</small><b>${fmt(x2, 2)}</b></div><div><small>Verdict</small><b style="font-size:14px">${x2 > 3.84 ? 'dépendants → feature utile' : 'pas de lien net'}</b></div></div>
      <p class="small muted" style="margin:8px 0 0">Repère : pour une table 2 × 2, χ² > 3.84 signale une dépendance au seuil de 5 %. On classe les features par χ² décroissant.</p>`;
  };
  bindSlider(el, 'fs-n', v => v, drawN).go();
  el.addEventListener('input', e => { if (e.target.id?.startsWith('fs-') && e.target.id !== 'fs-n') drawX(); });
  drawX();
}};

const KEY = 'mllab-v1';

try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const isDone = id => S.done.includes(id);
const toggleDone = id => { S.done = isDone(id) ? S.done.filter(x => x !== id) : [...S.done, id]; save(); };
const lecOf = id => LECTURES.find(l => l.id === id);
const qid = q => QUIZ.indexOf(q);

function qCard(q, onAnswer) {
  const wrap = document.createElement('div'); wrap.className = 'q-card';
  wrap.innerHTML = `<div class="eyebrow">Cours ${lecOf(q.l).n} · ${CONCEPTS.find(c => c.id === q.c).title}</div><div class="q-prompt">${q.q}</div>
    <div class="q-opts">${q.o.map((o, k) => `<button class="q-opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${o}</span></button>`).join('')}</div><div class="q-exp" hidden></div>`;
  let done = false;
  wrap.querySelector('.q-opts').addEventListener('click', e => {
    const b = e.target.closest('.q-opt'); if (!b || done) return; done = true;
    const k = +b.dataset.k, ok = k === q.a, id = qid(q);
    $$('.q-opt', wrap).forEach(x => { x.disabled = true; if (+x.dataset.k === q.a) x.classList.add('right'); else if (x === b) x.classList.add('wrong'); });
    if (ok) S.wrong = S.wrong.filter(x => x !== id); else if (!S.wrong.includes(id)) S.wrong.push(id); save();
    const ex = $('.q-exp', wrap); ex.hidden = false; ex.innerHTML = `<b>${ok ? 'Exact.' : 'Pas tout à fait.'}</b> ${q.e}`;
    onAnswer && onAnswer(ok);
  });
  return wrap;
}

function pageConcept(c) {
  const L = lecOf(c.lec), list = CONCEPTS, i = list.indexOf(c), prev = list[i - 1], next = list[i + 1];
  const qs = QUIZ.filter(q => q.c === c.id);
  const html = `<div class="c-head"><div class="eyebrow">Cours ${L.n} · ${L.short}</div><h1>${c.title}</h1><div class="en">${c.en} · <span class="slides-ref">slides ${c.slides}</span></div></div>
    <section class="essentiel"><h2>L'essentiel</h2>${c.ess}</section>
    ${c.demo ? `<section class="blk"><h2 class="eyebrow" style="font-size:13px;font-weight:500">À manipuler</h2><div class="demo"><p class="demo-hint">${DEMOS[c.demo].hint}</p><div data-demo></div></div></section>` : ''}
    <details class="deep"><summary>Creuser (détails, exemples, formules)</summary><div class="in">${c.deep}</div></details>
    <div class="trap"><b>Piège d'examen.</b> ${c.trap}</div>
    ${qs.length ? `<section class="blk"><h2 class="eyebrow" style="font-size:13px;font-weight:500;margin-bottom:10px">Teste-toi</h2><div style="display:grid;gap:12px" data-qs></div></section>` : ''}
    <div class="c-foot"><button class="btn ${isDone(c.id) ? 'good' : ''}" data-done>${isDone(c.id) ? '✓ Maîtrisé' : 'Je maîtrise ce concept'}</button>
    <div class="row">${prev ? `<a class="btn sm" href="#${prev.id}">← ${prev.title}</a>` : ''}${next ? `<a class="btn sm pri" href="#${next.id}">${next.title} →</a>` : `<a class="btn sm pri" href="#quiz">Faire le quiz →</a>`}</div></div>`;
  return { html, after(root) {
    if (c.demo) DEMOS[c.demo].mount($('[data-demo]', root));
    const qw = $('[data-qs]', root); if (qw) qs.forEach(q => qw.appendChild(qCard(q)));
    $('[data-done]', root).addEventListener('click', e => { toggleDone(c.id); e.currentTarget.className = 'btn ' + (isDone(c.id) ? 'good' : ''); e.currentTarget.textContent = isDone(c.id) ? '✓ Maîtrisé' : 'Je maîtrise ce concept'; renderNav(c.id); });
  } };
}

function pageQuiz(mode) {
  const html = `<div class="c-head"><div class="eyebrow">S'entraîner</div><h1>Quiz style examen</h1><p class="muted" style="margin:0">Questions de compréhension, comme les in-class questions. Chaque réponse est expliquée.</p></div>
    <div class="row" style="margin-bottom:16px"><div class="seg" data-m><button data-v="all">Tout</button><button data-v="l1">Cours 1</button><button data-v="l2">Cours 2</button><button data-v="err">Mes erreurs (${S.wrong.length})</button></div></div><div data-q></div>`;
  return { html, after(root) {
    const seg = $('[data-m]', root); $$('button', seg).forEach(b => b.classList.toggle('on', b.dataset.v === mode));
    seg.addEventListener('click', e => { const b = e.target.closest('button'); if (b) location.hash = b.dataset.v === 'all' ? 'quiz' : 'quiz-' + b.dataset.v; });
    let pool = mode === 'all' ? QUIZ : mode === 'err' ? S.wrong.map(i => QUIZ[i]).filter(Boolean) : QUIZ.filter(q => q.l === mode);
    const box = $('[data-q]', root);
    if (!pool.length) { box.innerHTML = `<div class="q-card"><p style="margin:0">Aucune erreur enregistrée pour l'instant. Fais d'abord le quiz complet : chaque mauvaise réponse viendra s'ajouter ici jusqu'à ce que tu la réussisses.</p></div>`; return; }
    pool = pool.slice().sort(() => Math.random() - 0.5);
    let i = 0; const res = [];
    const step = () => {
      box.innerHTML = '';
      if (i >= pool.length) {
        const sc = Math.round(res.filter(Boolean).length / pool.length * 100);
        if (mode === 'l1' || mode === 'l2') { S.best[mode] = Math.max(S.best[mode] || 0, sc); save(); }
        const miss = [...new Set(pool.filter((_, k) => !res[k]).map(q => q.c))];
        box.innerHTML = `<div class="q-card"><div class="eyebrow">Résultat</div><h2 style="font-size:40px;margin:6px 0">${res.filter(Boolean).length} / ${pool.length}</h2>
          <p>${sc >= 85 ? 'Très solide. Tu peux passer au cours suivant.' : sc >= 60 ? 'Bonne base. Revois les fiches ci-dessous, puis relance en mode « Mes erreurs ».' : 'Reprends les fiches ci-dessous avec leurs démos, puis réessaie.'}</p>
          ${miss.length ? `<p class="small muted" style="margin-bottom:6px">À revoir :</p><div class="chips">${miss.map(id => `<a class="chip" href="#${id}">${CONCEPTS.find(c => c.id === id).title}</a>`).join('')}</div>` : ''}
          <div class="row" style="margin-top:16px"><button class="btn pri" data-again>Recommencer</button>${S.wrong.length ? `<a class="btn" href="#quiz-err">Mes erreurs (${S.wrong.length})</a>` : ''}</div></div>`;
        $('[data-again]', box).addEventListener('click', () => { i = 0; res.length = 0; pool.sort(() => Math.random() - 0.5); step(); });
        return;
      }
      const top = document.createElement('div'); top.className = 'q-top';
      top.innerHTML = `<span class="eyebrow">Question ${i + 1} / ${pool.length}</span><div class="q-progress">${pool.map((_, k) => `<i class="${k < i ? (res[k] ? 'r' : 'w') : k === i ? 'c' : ''}"></i>`).join('')}</div>`;
      box.appendChild(top);
      const card = qCard(pool[i], ok => { res[i] = ok; const nx = document.createElement('div'); nx.className = 'row'; nx.style.marginTop = '14px';
        nx.innerHTML = `<button class="btn pri">${i === pool.length - 1 ? 'Voir le résultat' : 'Question suivante'}</button><a class="btn sm" href="#${pool[i].c}">Revoir la fiche</a>`;
        nx.querySelector('button').addEventListener('click', () => { i++; step(); window.scrollTo({ top: 0 }); }); card.appendChild(nx); });
      box.appendChild(card);
    };
    step();
  } };
}

function pageFormulas() {
  return `<div class="c-head"><div class="eyebrow">Mémo</div><h1>Formulaire</h1><p class="muted" style="margin:0">Toutes les formules des cours 1 et 2 sur une page.</p></div>` +
    FORMULAS.map(s => `<section class="fsec"><h2>${s.t}</h2><div class="fl">${s.rows.map(r => `<div><span>${r[0]}</span><span class="fx">${r[1]}</span></div>`).join('')}</div></section>`).join('') +
    `<section class="fsec"><h2>Confusion matrix (disposition du cours)</h2><div class="tbl-wrap"><table class="cm"><tr><td colspan="2" rowspan="2" style="border:none"></td><th colspan="2">True class</th></tr><tr><th>−1</th><th>+1</th></tr>
    <tr><th rowspan="2">Predicted class</th><th>−1</th><td class="cell-tn">True Negatives</td><td class="cell-fn">False Negatives</td></tr><tr><th>+1</th><td class="cell-fp">False Positives</td><td class="cell-tp">True Positives</td></tr></table></div>
    <p class="small muted">Attention : la slide sur la ROC (cours 1 slide 131, cours 2 slide 10) utilise une autre disposition, avec TP en haut à gauche. Les définitions ne changent pas.</p></section>`;
}

/* ---------- router ---------- */
function route() {
  const h = (location.hash || '#home').slice(1), page = $('#page');
  let out;
  if (h.startsWith('quiz')) out = pageQuiz(h === 'quiz' ? 'all' : h.slice(5));
  else if (h === 'formules') out = { html: pageFormulas() };
  else { const c = CONCEPTS.find(c => c.id === h); out = c ? pageConcept(c) : { html: pageHome() }; }
  page.innerHTML = out.html; out.after && out.after(page);
  renderNav(h); $('#side').classList.remove('open'); window.scrollTo({ top: 0 });
}
window.addEventListener('hashchange', route);
document.addEventListener('click', e => { if (e.target.closest('[data-go="home"]')) location.hash = 'home'; });
$('#menuBtn').addEventListener('click', () => $('#side').classList.toggle('open'));
document.addEventListener('click', e => { const side = $('#side'); if (side.classList.contains('open') && !side.contains(e.target) && !e.target.closest('#menuBtn')) side.classList.remove('open'); });
route();
</script>
</body>
</html>
