<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ML Lab DSBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : sommaire fixe à gauche (cours → concepts), une fiche à la fois à droite. Surligneur jaune = repris du bandeau des slides du cours. */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --surface-2:#eef0f5; --ink:#171a2c; --muted:#5a6079; --line:#dde0e9;
  --accent:#2f3c8f; --accent-ink:#ffffff; --accent-soft:#e6e8f6;
  --pos:#d4472b; --pos-soft:#f8ddd6; --neg:#3567cf; --neg-soft:#d9e3f8; --mix:#b13fd0;
  --ok:#1d8556; --ok-soft:#d8f0e4; --warn:#a86a12; --warn-soft:#f8ead2;
  --hl:#f6c444; --hl-soft:#fbe7a8;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11131b; --surface:#191c27; --surface-2:#212534; --ink:#e8eaf3; --muted:#9ba1b9; --line:#2d3244;
  --accent:#95a1ff; --accent-ink:#11131b; --accent-soft:#252a4a;
  --pos:#ff7a5c; --pos-soft:#4a2620; --neg:#72a0ff; --neg-soft:#1f2c4d; --mix:#d07af0;
  --ok:#4cc58c; --ok-soft:#173a2a; --warn:#e3a645; --warn-soft:#3b2d14;
  --hl:#e8b64a; --hl-soft:#4a3a12; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11131b; --surface:#191c27; --surface-2:#212534; --ink:#e8eaf3; --muted:#9ba1b9; --line:#2d3244;
  --accent:#95a1ff; --accent-ink:#11131b; --accent-soft:#252a4a;
  --pos:#ff7a5c; --pos-soft:#4a2620; --neg:#72a0ff; --neg-soft:#1f2c4d; --mix:#d07af0;
  --ok:#4cc58c; --ok-soft:#173a2a; --warn:#e3a645; --warn-soft:#3b2d14;
  --hl:#e8b64a; --hl-soft:#4a3a12; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.6;margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
mark{background:linear-gradient(transparent 55%, var(--hl-soft) 55%);color:inherit;padding:0 .1em}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:22px 16px 40px}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px;cursor:pointer}
.brand b{font-family:var(--f-display);font-size:24px;font-weight:800;letter-spacing:-.02em}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav-sec{margin:14px 0 4px;padding:0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.nav a{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.3}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dot{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.nav a .tag{margin-left:auto;font-size:10px;font-family:var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.nav .tool{font-weight:500}
.mbar{display:none}
main{padding-inline:clamp(16px,4vw,56px);padding-block:36px 80px;min-width:0}
.page{max-width:860px;margin:0 auto}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 25% 0 0;z-index:30;height:100%;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .mbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  .mbar b{font-family:var(--f-display);font-size:19px}
  main{padding-block:22px 60px}
}
@media (max-width:520px){ .side{inset:0 10% 0 0} }

/* ---------- common ---------- */
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.good{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.btn.sm{padding:4px 10px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13.5px}

/* concept page */
.c-head{display:grid;gap:8px;margin-bottom:22px}
.c-head h1{font-size:clamp(28px,4.4vw,40px);font-weight:800;letter-spacing:-.02em}
.c-head .en{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.essentiel{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--hl);border-radius:var(--r);padding:16px 20px}
.essentiel h2,.blk h2{font-size:13px;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:8px}
.essentiel ul{margin:0;padding-left:18px;display:grid;gap:4px}
.essentiel p{margin:0}
.blk{margin-top:26px}
.demo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:10px}
.demo-hint{font-size:13.5px;color:var(--muted);margin:0 0 12px}
details.deep{margin-top:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.deep summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
details.deep summary::-webkit-details-marker{display:none}
details.deep summary::before{content:"+";font-family:var(--f-mono);width:18px;height:18px;display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:4px;font-size:13px}
details.deep[open] summary::before{content:"–"}
details.deep .in{padding:0 18px 16px}
details.deep .in p:first-child{margin-top:0}
.trap{margin-top:12px;background:var(--warn-soft);border-radius:var(--r);padding:12px 16px;font-size:14.5px}
.trap b:first-child{color:var(--warn)}
.slides-ref{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.c-foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}

/* formulas */
.f{font-family:var(--f-mono);font-size:14.5px;background:var(--surface-2);border-radius:6px;padding:2px 7px;white-space:nowrap}
.fblock{font-family:var(--f-mono);font-size:15px;background:var(--surface-2);border-radius:8px;padding:12px 14px;margin:10px 0;overflow-x:auto;line-height:2}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.25;margin:0 3px}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}

/* tables / matrices */
.tbl-wrap{overflow-x:auto}
table.cm{border-collapse:collapse;font-size:14px;margin:0 auto}
table.cm td,table.cm th{border:1px solid var(--line);padding:7px 12px;text-align:center}
table.cm th{font-weight:500;color:var(--muted);font-size:12.5px}
.cell-tp{background:var(--pos-soft)} .cell-tn{background:var(--neg-soft)}
.cell-fp,.cell-fn{background:var(--surface-2)}
.cm .big{font-family:var(--f-mono);font-size:18px;font-weight:500;display:block}
.cm .lab{font-size:11.5px;color:var(--muted)}
.mat{display:inline-grid;gap:2px;font-family:var(--f-mono);font-size:12.5px;position:relative;padding:0 6px;vertical-align:middle}
.mat::before,.mat::after{content:"";position:absolute;top:0;bottom:0;width:5px;border:1.5px solid var(--muted)}
.mat::before{left:0;border-right:none}.mat::after{right:0;border-left:none}
.mat span{min-width:38px;text-align:right;padding:1px 4px;border-radius:3px}
.mat-cap{font-size:11.5px;font-family:var(--f-mono);color:var(--muted);text-align:center;margin-top:4px}
.mrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;overflow-x:auto;padding-bottom:4px}
.op{font-family:var(--f-mono);font-size:18px;color:var(--muted)}

/* controls */
.ctl{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:14px}
.ctl output{font-family:var(--f-mono);text-align:right}
.ctls{display:grid;gap:8px;margin-bottom:14px}
input[type=range]{width:100%;accent-color:var(--accent)}
@media (max-width:520px){.ctl{grid-template-columns:1fr 56px}.ctl input{grid-column:1/-1;grid-row:2}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:13.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.grid2>*{min-width:0}
svg.plot{width:100%;height:auto;display:block;overflow:hidden}
svg .ax{stroke:var(--muted);stroke-width:1}
svg .grid{stroke:var(--line);stroke-width:1}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
svg .t-ink{fill:var(--ink)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.stat div{background:var(--surface-2);border-radius:8px;padding:8px 10px;min-width:0}
.stat small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.stat b{font-family:var(--f-mono);font-size:17px;font-weight:500}
.metrics{display:grid;gap:6px;font-size:14px}
.metric{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--surface-2);border-radius:8px;padding:7px 10px}
.metric .nm{font-weight:600}
.metric .al{font-size:12px;color:var(--muted);display:block;font-weight:400}
.metric .calc{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-align:right}
.metric .val{font-family:var(--f-mono);font-size:16px;color:var(--ink);display:block}
.callout{border-radius:8px;padding:9px 12px;font-size:14px;margin-top:10px;background:var(--accent-soft)}
.callout.ok{background:var(--ok-soft)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pill.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}

/* home */
.hero{display:grid;gap:10px;margin-bottom:28px}
.hero h1{font-size:clamp(32px,5.5vw,52px);font-weight:800;letter-spacing:-.03em}
.hero p{margin:0;max-width:62ch;color:var(--muted)}
.lec-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.lec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;align-content:start}
.lec h3{font-size:21px}
.bar{height:6px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;cursor:pointer;background:var(--surface);text-decoration:none;color:var(--ink)}
.chip.done{border-color:var(--ok);color:var(--ok)}
.chip:hover{border-color:var(--accent)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px;margin-top:10px}
.info div{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
.info b{font-family:var(--f-display);font-size:26px;display:block;line-height:1.1}
.info span{font-size:13px;color:var(--muted)}
.howto{display:grid;gap:8px;margin:0;padding-left:20px}

/* quiz */
.q-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.q-prompt{font-size:17px;font-weight:500;margin:6px 0 14px}
.q-opts{display:grid;gap:8px}
.q-opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;line-height:1.45}
.q-opt:hover:not([disabled]){border-color:var(--accent)}
.q-opt .k{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-top:2px;flex:none}
.q-opt.right{border-color:var(--ok);background:var(--ok-soft)}
.q-opt.wrong{border-color:var(--pos);background:var(--pos-soft)}
.q-opt[disabled]{cursor:default}
.q-exp{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--surface-2);font-size:14.5px}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.q-progress{display:flex;gap:3px;flex-wrap:wrap}
.q-progress i{width:14px;height:6px;border-radius:3px;background:var(--surface-2)}
.q-progress i.r{background:var(--ok)} .q-progress i.w{background:var(--pos)} .q-progress i.c{background:var(--accent)}

/* formulaire */
.fsec{margin-top:26px}
.fsec h2{font-size:22px;margin-bottom:10px}
.fl{display:grid;gap:8px}
.fl>div{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 14px}
.fl>div>span:first-child{font-weight:600;font-size:14px}
.fl .fx{font-family:var(--f-mono);font-size:14px;overflow-x:auto}
@media (max-width:560px){.fl>div{grid-template-columns:1fr;gap:2px}}

/* demo specific */
.sorter-q{font-size:16px;font-weight:500;margin-bottom:10px;min-height:3em}
.matedit{display:inline-grid;gap:4px}
.matedit input{width:46px;text-align:center;font-family:var(--f-mono);border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:3px 0}
.dm{border-collapse:collapse;font-family:var(--f-mono);font-size:13px}
.dm td,.dm th{border:1px solid var(--line);padding:4px 9px;text-align:center}
.dm th{font-family:var(--f-body);font-weight:500;font-size:12.5px;color:var(--muted)}
.dm td.sel-r,.dm th.sel-r{background:var(--neg-soft)}
.dm td.sel-c,.dm th.sel-c{background:var(--pos-soft)}
.dm td.sel-r.sel-c{background:var(--hl-soft)}
.fold-grid{display:grid;gap:3px}
.fold-row{display:grid;gap:3px;align-items:center;grid-template-columns:72px repeat(var(--k),1fr)}
.fold-row span{font-size:12px;font-family:var(--f-mono);color:var(--muted)}
.fold-row i{height:22px;border-radius:4px;background:var(--neg-soft);font-style:normal;font-size:11px;font-family:var(--f-mono);display:grid;place-items:center;color:var(--neg)}
.fold-row i.v{background:var(--hl);color:#2a2000}
.fold-row.cur i{outline:2px solid var(--accent);outline-offset:-2px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px;font-size:13px;cursor:pointer}
.steps button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <div class="mbar"><button class="btn sm" id="menuBtn" aria-label="Ouvrir le sommaire">☰ Sommaire</button><b>ML Lab</b></div>
  <nav class="side" id="side" aria-label="Sommaire"></nav>
  <main><div class="page" id="page"></div></main>
</div>
<script>
const F = (n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`;

const LECTURES = [
  { id: 'l1', n: 1, title: 'Introduction, model selection & evaluation', short: 'Intro & évaluation', date: '1 oct. 2026', slides: 133 },
  { id: 'l2', n: 2, title: 'Dimensionality reduction', short: 'Réduction de dimension', date: '8 oct. 2026', slides: 83 },
];

const CONCEPTS = [
/* ======================= COURS 1 ======================= */
{ id:'l1-types', lec:'l1', title:'Les types de problèmes ML', en:'supervised vs unsupervised', slides:'30, 62–78', demo:'types',
  ess:`<ul>
  <li><b>Supervised</b> : on a les données X <i>et</i> les labels y. On apprend f pour prédire y.
    <br>→ <mark>Classification</mark> si y est discret (chat/chien, spam), <mark>Regression</mark> si y est continu (prix, nombre de clics).</li>
  <li><b>Unsupervised</b> : pas de labels. On cherche une structure.
    <br>→ <mark>Clustering</mark> (grouper les points similaires) ou <mark>Dimensionality reduction</mark> (décrire avec moins de variables).</li>
  <li>On utilise le ML quand on ne sait pas écrire les règles à la main. Programme classique : data + rules → answers. ML : data + answers → rules.</li></ul>`,
  deep:`<p><b>Quand le ML est utile</b> (slide 30) : quand l'expertise humaine n'existe pas (bioinformatique), quand on ne sait pas l'expliquer (reconnaître un « 2 » manuscrit, la parole), ou quand la solution change dans le temps (routage réseau). Pas besoin de ML pour calculer ses impôts.</p>
  <p><b>Exemples du cours</b></p>
  <ul>
  <li>Classification : face recognition, spam detection, character recognition, precision medicine (ce patient est-il malade ?).</li>
  <li>Regression : click prediction, load prediction (combien d'utilisateurs à 18h ?), algorithmic trading.</li>
  <li>Clustering : customer segmentation, topic modeling, disease subtyping, community detection.</li>
  <li>Dimensionality reduction : stockage, suppression des redondances, curse of dimensionality, visualisation en 2D/3D.</li></ul>
  <p><b>Binary</b> classification : y ∈ {−1, +1}. <b>Multiclass</b> : y ∈ {1, …, K}. <b>Regression</b> : y ∈ ℝ.</p>`,
  trap:`Ce qui compte, c'est la forme de la sortie, pas le sujet. Prédire une note de 1 à 5 étoiles peut être de la multiclass classification. Prédire un prix est une régression.` },

{ id:'l1-design', lec:'l1', title:'La design matrix', en:'observations × features', slides:'78', demo:'design',
  ess:`<ul>
  <li>Les données forment une matrice <b>X</b> de taille <span class="f">n × p</span>.</li>
  <li>Les <b>n lignes</b> sont les <mark>observations</mark> (samples, data points). Les <b>p colonnes</b> sont les <mark>features</mark> (variables, attributes).</li>
  <li>En supervised, on a aussi un vecteur <b>y</b> de taille n : les <mark>labels</mark> (target, outcome).</li>
  <li>Objectif : trouver f telle que <span class="f">f(xᵢ) ≈ yᵢ</span> pour chaque observation i.</li></ul>`,
  deep:`<p>xᵢ désigne la i-ème ligne (un vecteur de p nombres). x<sub>ij</sub> désigne la valeur de la feature j pour l'observation i.</p>
  <p>Exemple chat/chien du cours : features « good eater » et « human contact », label −1 (chat) ou +1 (chien). Chaque animal est un point dans le <b>feature space</b>.</p>
  <p><b>Feature selection</b> (début du pipeline) : choisir des features informatives. « Pointy ears » et « size » séparent mieux chats et chiens que la couleur du collier.</p>`,
  trap:`Les notations changent d'un cours à l'autre. Au cours 1, X est n × p (n observations). Au cours 2 (SVD/PCA), A est m × n (m objets, n attributs). L'idée est la même, seules les lettres changent.` },

{ id:'l1-erm', lec:'l1', title:'Hypothesis class, loss & ERM', en:'empirical risk minimization', slides:'80–93', demo:'loss',
  ess:`<ul>
  <li><b>Hypothesis class F</b> : l'ensemble des fonctions qu'on s'autorise (des rectangles, des droites, des réseaux de neurones…). On la choisit selon ce qu'on croit du problème.</li>
  <li><b>Loss L(y, f(x))</b> : mesure l'écart entre le vrai label et la prédiction.</li>
  <li><b>ERM</b> : la vraie distribution D est inconnue. On minimise donc la loss moyenne sur le training set (<mark>empirical risk</mark>) au lieu de la vraie (<mark>true risk</mark>).</li></ul>
  <div class="fblock">R̂(f) = ${F('1','n')} Σᵢ L(yᵢ, f(xᵢ))&nbsp;&nbsp;&nbsp;&nbsp;f̂ = argmin<sub>f ∈ F</sub> R̂(f)</div>`,
  deep:`<p><b>Les 3 ingrédients du supervised learning</b> : une hypothesis class F, une loss L, une procédure d'optimisation.</p>
  <ul>
  <li><b>Quadratic loss</b> (y − f(x))² : pénalise fortement les grosses erreurs, donc sensible aux outliers.</li>
  <li><b>Absolute loss</b> |y − f(x)| : croît linéairement, plus robuste aux outliers.</li>
  <li><b>0/1 loss</b> : 1 si f(x) ≠ y, sinon 0. Compte les erreurs de classification. Pas dérivable, donc difficile à optimiser directement.</li></ul>
  <p><b>True risk</b> : R(f) = E<sub>(x,y)~D</sub>[L(y, f(x))]. On suppose les exemples tirés <b>i.i.d.</b> de D. Quand n est grand, l'empirical risk converge vers le true risk.</p>
  <p><b>Parametric</b> : f définie par des paramètres, ex. f(x) = wᵀx + b. <b>Non-parametric</b> : ex. f(x) = label du point le plus proche (nearest neighbors).</p>`,
  trap:`L'empirical risk n'est qu'une estimation du true risk, et il est trop optimiste quand le modèle overfit. Minimiser l'empirical risk ne garantit pas de bien généraliser.` },

{ id:'l1-overfit', lec:'l1', title:'Overfitting & underfitting', en:'generalization', slides:'96–102', demo:'overfit',
  ess:`<ul>
  <li>Le but n'est pas d'être bon sur le training set mais de <mark>généraliser</mark> à des données nouvelles.</li>
  <li><b>Underfitting</b> : modèle trop simple. Erreur élevée partout, en train comme en test.</li>
  <li><b>Overfitting</b> : modèle trop complexe, il apprend le bruit. Training error très basse, test error haute.</li>
  <li>Quand la complexité augmente, la training error baisse toujours, mais la test error dessine un <b>U</b>.</li></ul>`,
  deep:`<p><b>Pourquoi on ne peut pas viser 0 erreur</b> (slide 97) : les données contiennent du bruit. Features mal mesurées, erreurs de labels, features manquantes (latent).</p>
  <p><b>Occam's razor</b> : à performance égale, préférer le modèle le plus simple. Il est plus facile à entraîner, plus rapide, plus interprétable, et il généralise mieux.</p>
  <p>Dans la démo, la complexité est le degré du polynôme. Avec 12 points d'entraînement, un polynôme de degré 11 passe exactement par tous les points : training error ≈ 0, mais la courbe oscille n'importe comment entre eux.</p>`,
  trap:`Une training error de 0 n'est pas une bonne nouvelle en soi. C'est souvent le signe d'un overfitting.` },

{ id:'l1-biasvar', lec:'l1', title:'Bias–variance tradeoff', en:'bias-variance decomposition', slides:'103–110', demo:'biasvar',
  ess:`<ul>
  <li>Imagine qu'on ré-entraîne le même type de modèle sur plein de training sets différents.</li>
  <li><b>Bias</b> : à quelle distance la prédiction <i>moyenne</i> est de la vérité. Modèle trop simple → high bias → <mark>underfitting</mark>.</li>
  <li><b>Variance</b> : à quel point la prédiction <i>change</i> d'un training set à l'autre. Modèle trop complexe → high variance → <mark>overfitting</mark>.</li>
  <li>Plus de complexité : bias ↓, variance ↑. C'est le tradeoff.</li></ul>
  <div class="fblock">E[(y − f̂(x))²] = Bias[f̂(x)]² + Var[f̂(x)] + σ²</div>`,
  deep:`<p><b>Cadre</b> : y = f(x) + ε, avec ε un bruit de moyenne 0 et de variance σ². f̂ dépend du training set tiré.</p>
  <ul>
  <li>Bias[f̂(x)] = E[f̂(x)] − f(x)</li>
  <li>Var[f̂(x)] = E[(f̂(x) − E[f̂(x)])²]</li>
  <li>σ² = erreur irréductible : même un modèle parfait la subit.</li></ul>
  <p><b>La cible (slide 105)</b> : le centre est la bonne valeur, chaque tir est un modèle entraîné sur un autre training set. Bias = tirs groupés mais décalés. Variance = tirs dispersés.</p>
  <p><b>Diagnostic</b> : high bias → training <i>et</i> test errors élevées. High variance → training error basse, test error élevée.</p>
  <p><b>Astuce de la preuve</b> : E[X²] = Var(X) + E[X]².</p>`,
  trap:`Plus de données réduit la <b>variance</b>, pas le <b>bias</b>. Un modèle trop simple reste trop simple, même avec un million d'exemples.` },

{ id:'l1-split', lec:'l1', title:'Train, validation & test', en:'model selection vs assessment', slides:'111–119', demo:'split',
  ess:`<ul>
  <li><b>Training set</b> : pour entraîner les modèles.</li>
  <li><b>Validation set</b> : pour comparer les modèles et choisir les hyperparamètres (ex. k du kNN). C'est la <mark>model selection</mark>.</li>
  <li><b>Test set</b> : jamais touché pendant le processus, utilisé une seule fois à la fin pour estimer la generalization error. C'est la <mark>model assessment</mark>.</li></ul>
  <div class="row" style="margin-top:12px;gap:3px;flex-wrap:nowrap">
    <div style="flex:6;background:var(--neg-soft);color:var(--neg);border-radius:6px 0 0 6px;padding:6px 10px;font-size:13px">Training</div>
    <div style="flex:2;background:var(--hl-soft);border-radius:0;padding:6px 10px;font-size:13px">Validation</div>
    <div style="flex:2;background:var(--pos-soft);color:var(--pos);border-radius:0 6px 6px 0;padding:6px 10px;font-size:13px">Test</div></div>`,
  deep:`<p>La training error est une mauvaise estimation de la generalization error : le modèle a déjà vu ces données.</p>
  <p>Le validation set sert de « nouvelles données »… jusqu'au moment où on s'en sert pour choisir. Après, on a « triché » : il a influencé le choix, donc il n'est plus neutre. D'où le test set.</p>
  <p>Combien de données dans chaque set ? Quand on en a peu, on réutilise les données : <b>cross-validation</b> ou <b>bootstrap</b> (tirage avec remise).</p>`,
  trap:`Le score de validation du modèle <i>choisi</i> est biaisé vers le haut, car on a pris le meilleur. C'est la raison d'être du test set, et la démo le montre.` },

{ id:'l1-cv', lec:'l1', title:'Cross-validation', en:'k-fold, LOOCV', slides:'120–125', demo:'cv',
  ess:`<ul>
  <li>On coupe les données en <b>k folds</b>. On entraîne k fois : à chaque tour, un fold sert de validation et les k − 1 autres d'entraînement.</li>
  <li>CV error = moyenne des k erreurs de validation. Chaque point sert exactement une fois en validation.</li>
  <li><b>LOOCV</b> (leave-one-out) = cas extrême où k = n.</li>
  <li>En pratique : <mark>k = 5 ou 10</mark>, bon équilibre entre bias, variance et temps de calcul.</li></ul>`,
  deep:`<p><b>Effet de k</b></p>
  <ul>
  <li><b>k petit</b> (k = 2) : chaque modèle ne voit que n/2 observations, beaucoup moins que le modèle final. L'erreur de CV est donc biaisée (trop pessimiste).</li>
  <li><b>k grand</b> : chaque modèle voit presque tout, donc moins de bias. Mais il faut k entraînements.</li>
  <li><b>LOOCV</b> : estimation presque sans biais et utilise presque toutes les données. Mais n entraînements (coûteux) et une variance élevée, car chaque fold de validation ne contient qu'un point.</li></ul>
  <p>En scikit-learn : <span class="f">cross_val_score(model, X, y, cv=5)</span>.</p>`,
  trap:`La CV sert à estimer la performance et à choisir le modèle. Une fois le choix fait, on ré-entraîne le modèle final sur toutes les données d'entraînement.` },

{ id:'l1-confusion', lec:'l1', title:'Confusion matrix & métriques', en:'precision, recall, F1…', slides:'127–129', demo:'confusion',
  ess:`<ul>
  <li>4 cases : TP, TN, <b>FP</b> (fausse alarme = <mark>type I error</mark>), <b>FN</b> (raté = <mark>type II error</mark>).</li>
  <li>Le deuxième mot (Positive/Negative) = ce que le modèle a <i>prédit</i>. True/False = s'il avait raison.</li>
  <li>Toutes les métriques sont des ratios de ces 4 nombres. Le piège est toujours le dénominateur.</li></ul>
  <div class="fblock">Recall = ${F('TP','TP + FN')}&nbsp;&nbsp;&nbsp;Precision = ${F('TP','TP + FP')}&nbsp;&nbsp;&nbsp;Specificity = ${F('TN','TN + FP')}</div>`,
  deep:`<p><b>Pour s'en souvenir</b></p>
  <ul>
  <li><b>Recall</b> (= sensitivity = TPR) : parmi les vrais positifs, combien j'en trouve. Dénominateur = tous les vrais +1.</li>
  <li><b>Precision</b> (= PPV) : parmi ce que j'ai prédit +1, combien sont justes. Dénominateur = tous les prédits +1.</li>
  <li><b>Specificity</b> (= TNR) : parmi les vrais négatifs, combien je reconnais.</li>
  <li><b>FDR</b> = FP / (TP + FP) = 1 − precision.</li>
  <li><b>Accuracy</b> = (TP + TN) / total.</li>
  <li><b>F1</b> = 2 · P · R / (P + R) : moyenne harmonique. Elle s'effondre dès que P ou R est faible.</li></ul>
  <p><b>Quelle métrique privilégier ?</b> Le recall si un FN coûte cher (maladie, fraude). La precision si un FP coûte cher (un filtre anti-spam qui jette un mail important).</p>`,
  trap:`<b>Accuracy paradox</b> : avec 99 % de négatifs, un modèle qui répond toujours −1 obtient 99 % d'accuracy et un recall de 0. Sur des données déséquilibrées, regarde precision, recall et F1.` },

{ id:'l1-roc', lec:'l1', title:'ROC curve & AUC', en:'receiver operating characteristic', slides:'130–131', demo:'roc',
  ess:`<ul>
  <li>Le classifier sort un score X. On prédit +1 si <span class="f">X &gt; T</span>.</li>
  <li>Chaque seuil T donne un point (FPR, TPR). En faisant varier T, on trace la <mark>ROC curve</mark>.</li>
  <li>Diagonale = modèle au hasard (AUC = 0.5). Coin en haut à gauche = modèle parfait (AUC = 1).</li>
  <li><b>AUC</b> = aire sous la courbe : la performance globale, tous seuils confondus.</li></ul>
  <div class="fblock">TPR = ${F('TP','TP + FN')}&nbsp;&nbsp;&nbsp;&nbsp;FPR = ${F('FP','FP + TN')} = 1 − specificity</div>`,
  deep:`<p><b>Les extrêmes</b> : T très bas → tout est prédit +1 → TPR = FPR = 1 (coin en haut à droite). T très haut → rien n'est prédit +1 → TPR = FPR = 0.</p>
  <p><b>Ce qui fait l'AUC</b> : le recouvrement entre f₀ (distribution du score chez les négatifs) et f₁ (chez les positifs). Moins elles se chevauchent, plus la courbe monte vers le coin.</p>
  <p><b>Interprétation de l'AUC</b> : la probabilité qu'un positif tiré au hasard ait un score plus élevé qu'un négatif tiré au hasard.</p>
  <p>TPR et FPR sont calculés <i>à l'intérieur</i> de chaque classe : la ROC ne dépend pas de la proportion de positifs. La precision, elle, en dépend (essaie le curseur de prévalence).</p>
  <p>Démo du prof : <a href="https://kennis-research.shinyapps.io/ROC-Curves/" target="_blank" rel="noopener">kennis-research.shinyapps.io/ROC-Curves</a></p>`,
  trap:`Changer le seuil <b>déplace le point</b> sur la courbe, ça ne change pas la courbe. Seul un meilleur modèle (des distributions mieux séparées) améliore l'AUC.` },

/* ======================= COURS 2 ======================= */
{ id:'l2-why', lec:'l2', title:'Pourquoi réduire la dimension ?', en:'curse of dimensionality', slides:'12–24', demo:'curse',
  ess:`<ul>
  <li>Les données réelles ont souvent des milliers de dimensions (les mots d'un vocabulaire, les utilisateurs d'un réseau).</li>
  <li><b>Curse of dimensionality</b> : en grande dimension, les données deviennent éparses et les distances perdent leur sens. Tous les points finissent à peu près à la même distance les uns des autres.</li>
  <li>Souvent, les données vivent en fait dans un sous-espace plus petit. On cherche B (m × k) avec <span class="f">k ≪ n</span> qui garde l'essentiel de A (m × n).</li></ul>`,
  deep:`<p><b>Pourquoi c'est utile</b> (slide 20) : découvrir des corrélations cachées (des mots qui apparaissent ensemble), éliminer les features bruitées, interpréter, visualiser en 2D/3D, stocker moins, calculer plus vite.</p>
  <p><b>Exemples de matrices</b></p>
  <ul>
  <li>Document-term : A<sub>ij</sub> = fréquence du mot j dans le document i.</li>
  <li>Recommandation : A<sub>ij</sub> = note du film j par le client i.</li></ul>
  <p><b>Deux familles</b> : la <b>feature extraction</b> crée de nouvelles features qui combinent les anciennes (PCA, SVD, MDS…). La <b>feature selection</b> garde un sous-ensemble des features d'origine.</p>`,
  trap:`Réduire la dimension ne sert pas qu'à compresser. En retirant les dernières dimensions, souvent du bruit, on fait ressortir la partie utile du signal.` },

{ id:'l2-rank', lec:'l2', title:'Rank d\'une matrice', en:'rank = dimensionality', slides:'15–17', demo:'rank',
  ess:`<ul>
  <li><b>Rank</b> = nombre de lignes (ou de colonnes) <mark>linéairement indépendantes</mark>.</li>
  <li>C'est la « vraie » dimension des données : si rank = 2, chaque ligne s'écrit avec seulement 2 vecteurs de base.</li>
  <li><span class="f">r ≤ min(m, n)</span>, et r = nombre de singular values non nulles.</li></ul>`,
  deep:`<p><b>Exemple de la slide 16</b> : les lignes [1 2 1], [−2 −3 1] et [3 5 0]. La troisième = première − deuxième, donc rank = 2.</p>
  <p>On peut alors changer de base : avec les vecteurs [1 2 1] et [−2 −3 1], les trois points ont pour nouvelles coordonnées A = [1 0], B = [0 1], C = [1 −1]. On passe de 3 coordonnées à 2.</p>
  <p>Dans la matrice clients × jours de la démo, chaque ligne est un multiple de [1 1 1 0 0] (semaine) ou de [0 0 0 1 1] (week-end). Rank = 2, même avec 6 clients.</p>`,
  trap:`Une ligne de zéros, ou une ligne multiple d'une autre, n'augmente pas le rank. Et le rank des lignes est toujours égal au rank des colonnes.` },

{ id:'l2-eigen', lec:'l2', title:'Eigenvalues & eigenvectors', en:'Au = λu', slides:'26', demo:'eigen',
  ess:`<ul>
  <li>u est un <b>eigenvector</b> de A si <span class="f">A u = λ u</span> : A ne fait qu'étirer u, sans le faire tourner. λ est l'<b>eigenvalue</b>, le facteur d'étirement.</li>
  <li>Une matrice symétrique s'écrit <span class="f">A = U Λ Uᵀ</span> : U orthogonale (eigenvectors en colonnes), Λ = diag(λ₁ ≥ … ≥ λₙ).</li>
  <li>C'est la brique de base de la SVD et de la PCA.</li></ul>`,
  deep:`<p>λ est une eigenvalue si et seulement si (A − λI)u = 0 a une solution non nulle, c'est-à-dire <span class="f">det(A − λI) = 0</span>.</p>
  <p><b>Matrice 2×2 symétrique</b> [[a, b], [b, d]] : λ = (a + d)/2 ± √(((a − d)/2)² + b²).</p>
  <p><b>Exemple</b> : [[2, 1], [1, 2]] a λ₁ = 3 avec u₁ = [1, 1]/√2, et λ₂ = 1 avec u₂ = [1, −1]/√2.</p>
  <p><b>Orthogonal matrix</b> : QᵀQ = QQᵀ = I. Les colonnes sont de norme 1 et perpendiculaires entre elles.</p>`,
  trap:`Un eigenvector n'est défini qu'à un facteur près : u, −u ou 2u sont « le même ». C'est pour ça que les signes changent d'un logiciel à l'autre (et entre deux slides du cours).` },

{ id:'l2-svd', lec:'l2', title:'SVD : A = UΣVᵀ', en:'singular value decomposition', slides:'27–41', demo:'svd',
  ess:`<ul>
  <li>Toute matrice réelle se décompose en <span class="f">A = U Σ Vᵀ</span>.</li>
  <li><b>U</b> (m × r) : lignes ↔ concepts, ex. <mark>user-to-concept</mark>.</li>
  <li><b>V</b> (n × r) : colonnes ↔ concepts, ex. <mark>movie-to-concept</mark>.</li>
  <li><b>Σ</b> (r × r, diagonale) : la force de chaque concept, σ₁ ≥ σ₂ ≥ … ≥ 0.</li>
  <li>U et V sont orthonormales : UᵀU = I, VᵀV = I.</li></ul>`,
  deep:`<p><b>Somme de matrices de rank 1</b> : A = σ₁u₁v₁ᵀ + σ₂u₂v₂ᵀ + … Chaque terme est un « concept ».</p>
  <p><b>Lien avec les eigenvalues</b> (slide 32)</p>
  <ul>
  <li>Colonnes de U = eigenvectors de AAᵀ.</li>
  <li>Colonnes de V = eigenvectors de AᵀA.</li>
  <li>σᵢ = √λᵢ, avec λᵢ les eigenvalues de AᵀA (ou AAᵀ).</li></ul>
  <p>La SVD est <b>unique</b> (aux signes près). Coût : O(nm²) ou O(n²m), le plus petit des deux. Pour une matrice symétrique, singular values = |eigenvalues|.</p>`,
  trap:`Attention aux dimensions : U est m × r (une ligne par user), V est n × r (une ligne par film), et c'est <b>Vᵀ</b> qui apparaît dans le produit.` },

{ id:'l2-lowrank', lec:'l2', title:'Low-rank approximation & energy', en:'truncated SVD', slides:'42–56', demo:'lowrank',
  ess:`<ul>
  <li>Pour réduire la dimension, on garde les k plus grandes singular values et on met les autres à 0 : <span class="f">A_k = U_k Σ_k V_kᵀ</span>.</li>
  <li>A_k est la <mark>meilleure approximation de rank k</mark> : elle minimise l'erreur de reconstruction ‖A − A_k‖_F.</li>
  <li>Combien en garder ? Règle : conserver <mark>80–90 % de l'energy</mark>, avec energy = Σ σᵢ².</li></ul>`,
  deep:`<p><b>Frobenius norm</b> : ‖M‖_F = √(Σᵢⱼ Mᵢⱼ²). Et ‖A − A_k‖_F² = σ²<sub>k+1</sub> + … + σ²<sub>r</sub> : l'erreur, c'est exactement l'energy jetée.</p>
  <p><b>Vision géométrique</b> (slides 42–46) : chaque user est un point dans l'espace des films. v₁ est la direction qui minimise la somme des erreurs de reconstruction quand on projette les points dessus. Avec des données centrées, c'est aussi la direction de variance maximale, d'où le lien avec la PCA.</p>
  <p>Nouvelle coordonnée 1D de chaque user = sa projection sur v₁ = colonne 1 de UΣ (= A v₁).</p>`,
  trap:`L'energy se calcule avec les σᵢ <b>au carré</b>. Avec σ = 12.4, 9.5, 1.3, garder k = 1 conserve 62.6 % de l'energy, pas 12.4 / 23.2 = 53 %.` },

{ id:'l2-pca', lec:'l2', title:'PCA : maximiser la variance', en:'principal component analysis', slides:'57–64', demo:'pca',
  ess:`<ul>
  <li>La <b>PCA</b> cherche les directions dans lesquelles les données <mark>varient le plus</mark>, puis projette les données dessus.</li>
  <li>1<sup>er</sup> principal axis = direction de variance maximale. Les suivants sont orthogonaux aux précédents et maximisent la variance qui reste.</li>
  <li>Solution : les eigenvectors de <span class="f">Σ = CᵀC</span> (C = données centrées), triés par eigenvalue décroissante.</li>
  <li>Méthode unsupervised. Il faut <b>centrer</b> les données et, en général, <b>standardiser</b> les features.</li></ul>`,
  deep:`<p><b>Le raisonnement</b> : projection sur une direction unitaire w → z = Xw. Avec les données centrées, Var(z) ∝ wᵀ(XᵀX)w = wᵀΣw.</p>
  <p>On maximise wᵀΣw sous la contrainte ‖w‖ = 1. C'est un <b>Rayleigh quotient</b> : le maximum vaut λ₁ (la plus grande eigenvalue), atteint quand w = u₁ (son eigenvector).</p>
  <p><b>Standardization</b> : mean centering (moyenne 0) puis variance scaling (variance 1). Sinon, une feature exprimée en grandes unités a une grande variance et domine tout.</p>
  <p><b>PCA ↔ SVD</b> : si C = UΣVᵀ, alors CᵀC = VΣ²Vᵀ. Les principal axes sont les right singular vectors V, et λᵢ = σᵢ².</p>`,
  trap:`Sans standardisation, une feature en grandes unités (un salaire en euros face à un âge en années) écrase les autres : PC1 s'aligne simplement sur elle. Essaie l'échelle ×5 dans la démo.` },

{ id:'l2-pcaalgo', lec:'l2', title:'L\'algorithme PCA pas à pas', en:'PCA algorithm', slides:'65–66', demo:'pcasteps',
  ess:`<ul>
  <li>1. X : matrice m × n (m observations, n features).</li>
  <li>2. Centrer : <span class="f">C = X − M</span> (on retire à chaque colonne sa moyenne).</li>
  <li>3. Covariance : <span class="f">Σ = CᵀC</span>.</li>
  <li>4. <b>Principal axes</b> = les k eigenvectors de Σ qui ont les plus grandes eigenvalues.</li>
  <li>5. <b>Principal components</b> = projection <span class="f">C · U[1…k]</span>.</li></ul>
  <div class="fblock">variance expliquée par k axes = ${F('λ₁ + … + λₖ','λ₁ + … + λₙ')}&nbsp;&nbsp;→ viser ≈ 85 %</div>`,
  deep:`<p>La variance totale vaut trace(Σ) = λ₁ + … + λₙ. Pour choisir k, on prend le plus petit k qui explique environ 85 % de cette variance, comme pour l'energy de la SVD.</p>
  <p>Le cours écrit Σ = CᵀC, sans diviser par m. Ça multiplie toutes les eigenvalues par la même constante : les axes et les pourcentages ne changent pas.</p>`,
  trap:`<b>Principal axes</b> = des directions (les eigenvectors). <b>Principal components</b> = les nouvelles coordonnées des données (la projection C·U). Les questions d'examen aiment cette distinction.` },

{ id:'l2-nonlin', lec:'l2', title:'MDS, Isomap & LLE', en:'non-linear dimensionality reduction', slides:'67–75', demo:'isomap',
  ess:`<ul>
  <li>PCA et SVD sont <b>linéaires</b> : elles projettent sur un plan. Si les données vivent sur une surface courbée (le <mark>Swiss roll</mark>), ça ne suffit pas.</li>
  <li><b>MDS</b> : à partir d'une matrice de distances, place les points en petite dimension en préservant au mieux ces distances (minimise le <b>stress</b>).</li>
  <li><b>Isomap</b> : MDS avec les distances <mark>géodésiques</mark> (le long de la surface). kNN graph → shortest paths → MDS.</li>
  <li><b>LLE</b> : chaque point est reconstruit comme combinaison linéaire de ses voisins, et on garde ces mêmes poids en petite dimension.</li></ul>`,
  deep:`<p><b>Stress</b> (MDS) : mesure l'écart entre δᵢⱼ (distance d'origine) et dᵢⱼ (distance dans le nouvel espace), en gros Σ (δᵢⱼ − dᵢⱼ)². Exemple du cours : retrouver la carte des USA à partir de la matrice des distances entre 10 villes.</p>
  <p><b>Isomap en 3 étapes</b> : 1) kNN graph ; 2) shortest paths entre tous les nœuds (approximation de la distance géodésique) → matrice D ; 3) MDS sur D.</p>
  <p><b>LLE en 3 étapes</b> : 1) trouver les K voisins de chaque Xᵢ ; 2) calculer les poids W qui reconstruisent au mieux Xᵢ à partir de ses voisins ; 3) trouver les Yᵢ en petite dimension qui respectent les mêmes poids.</p>
  <p><b>Récap (slide 75)</b> : linéaires = PCA/SVD, NMF, CUR, LDA (supervised). Non linéaires = MDS, Isomap, LLE.</p>`,
  trap:`Sur le Swiss roll, deux points peuvent être proches en distance euclidienne mais très loin le long de la surface. Isomap utilise la seconde distance, la PCA ne voit que la première.` },

{ id:'l2-fsel', lec:'l2', title:'Feature selection', en:'filter, wrapper, embedded', slides:'76–82', demo:'fsel',
  ess:`<ul>
  <li><b>Feature selection</b> : garder p features d'origine parmi n. Contrairement à la PCA, on ne crée pas de nouvelles features.</li>
  <li><b>Filter</b> : un score statistique par feature (correlation, χ², information gain). Rapide.</li>
  <li><b>Wrapper</b> : on cherche le meilleur sous-ensemble en entraînant le modèle (forward/backward search). Précis mais coûteux.</li>
  <li><b>Embedded</b> : le modèle choisit ses features pendant l'entraînement.</li></ul>`,
  deep:`<p><b>χ² test</b> : teste l'indépendance entre une feature A et la classe C.</p>
  <div class="fblock">χ² = Σᵢ Σⱼ ${F('(Oᵢⱼ − Eᵢⱼ)²','Eᵢⱼ')}&nbsp;&nbsp;&nbsp;Eᵢⱼ = ${F('(# valeur i) × (# classe j)','m')}</div>
  <p>χ² élevé → la feature et la classe sont dépendantes → feature utile.</p>
  <p><b>Forward search</b> : on part de F = ∅. À chaque étape, on ajoute la feature qui fait le plus baisser l'erreur E(F), et on s'arrête quand plus rien ne s'améliore. Coût O(n² · T) au lieu de O(2ⁿ), T étant le coût d'un entraînement.</p>
  <p><b>Backward search</b> : on part de toutes les features et on en retire. <b>Floating search</b> : on alterne ajouter q / retirer r.</p>
  <p>Intérêts : interprétabilité, entraînement plus rapide, moins d'overfitting.</p>`,
  trap:`Filter = rapide mais ignore le modèle et les interactions entre features. Wrapper = tient compte du modèle mais coûte cher (2ⁿ sous-ensembles possibles).` },
];

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function rng(seed) { let s = (seed >>> 0) || 1; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }
function randn(r) { let u = 0; while (u === 0) u = r(); const v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function erf(x) { const s = Math.sign(x); x = Math.abs(x); const t = 1 / (1 + 0.3275911 * x);
  const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return s * y; }
const Phi = x => 0.5 * (1 + erf(x / Math.SQRT2));
const gpdf = (x, m) => Math.exp(-0.5 * (x - m) ** 2) / Math.sqrt(2 * Math.PI);
const fmt = (x, d = 2) => { if (!isFinite(x)) return '—'; const v = Math.abs(x) < 0.5 * 10 ** -d ? 0 : x; return v.toFixed(d); };
const pct = (x, d = 1) => isFinite(x) ? (x * 100).toFixed(d) + ' %' : '—';
const lin = (d0, d1, r0, r1) => v => r0 + (v - d0) / (d1 - d0) * (r1 - r0);
const logsc = (d0, d1, r0, r1) => v => r0 + (Math.log10(Math.max(v, d0 * 0.5)) - Math.log10(d0)) / (Math.log10(d1) - Math.log10(d0)) * (r1 - r0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function slider(id, label, min, max, step, val) {
  return `<label class="ctl" for="${id}"><span>${label}</span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><output id="${id}-o"></output></label>`;
}
function bindSlider(el, id, fmtFn, cb) {
  const inp = $('#' + id, el), out = $('#' + id + '-o', el);
  const go = () => { out.textContent = fmtFn(+inp.value); cb(+inp.value); };
  inp.addEventListener('input', go); return { inp, go, set(v) { inp.value = v; go(); } };
}
function axesSVG(o) {
  // o: {W,H,m:{l,r,t,b}, sx, sy, xt:[..], yt:[..], fx, fy, xlab, ylab}
  const { W, H, m, sx, sy } = o; let s = '';
  (o.yt || []).forEach(v => { const y = sy(v); s += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}"/><text x="${m.l - 6}" y="${y + 3.5}" text-anchor="end">${(o.fy || String)(v)}</text>`; });
  (o.xt || []).forEach(v => { const x = sx(v); s += `<line class="grid" y1="${m.t}" y2="${H - m.b}" x1="${x}" x2="${x}" opacity=".5"/><text x="${x}" y="${H - m.b + 15}" text-anchor="middle">${(o.fx || String)(v)}</text>`; });
  s += `<line class="ax" x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}"/><line class="ax" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${H - m.b}"/>`;
  if (o.xlab) s += `<text x="${(m.l + W - m.r) / 2}" y="${H - 4}" text-anchor="middle">${o.xlab}</text>`;
  if (o.ylab) s += `<text transform="translate(12 ${(m.t + H - m.b) / 2}) rotate(-90)" text-anchor="middle">${o.ylab}</text>`;
  return s;
}

const mm = (A, B) => A.map(r => B[0].map((_, j) => r.reduce((s, v, k) => s + v * B[k][j], 0)));
function jacobi(S) {
  const n = S.length, A = S.map(r => r.slice()), V = S.map((_, i) => S.map((_, j) => +(i === j)));
  for (let sw = 0; sw < 80; sw++) {
    let off = 0; for (let p = 0; p < n; p++) for (let q = p + 1; q < n; q++) off += A[p][q] ** 2;
    if (off < 1e-20) break;
    for (let p = 0; p < n - 1; p++) for (let q = p + 1; q < n; q++) {
      if (Math.abs(A[p][q]) < 1e-18) continue;
      const th = (A[q][q] - A[p][p]) / (2 * A[p][q]);
      const t = (th >= 0 ? 1 : -1) / (Math.abs(th) + Math.sqrt(th * th + 1));
      const c = 1 / Math.sqrt(t * t + 1), s = t * c;
      for (let k = 0; k < n; k++) { const a = A[k][p], b = A[k][q]; A[k][p] = c * a - s * b; A[k][q] = s * a + c * b; }
      for (let k = 0; k < n; k++) { const a = A[p][k], b = A[q][k]; A[p][k] = c * a - s * b; A[q][k] = s * a + c * b; }
      for (let k = 0; k < n; k++) { const a = V[k][p], b = V[k][q]; V[k][p] = c * a - s * b; V[k][q] = s * a + c * b; }
    }
  }
  const idx = [...Array(n).keys()].sort((i, j) => A[j][j] - A[i][i]);
  return { vals: idx.map(i => A[i][i]), vecs: idx.map(i => V.map(r => r[i])) }; // vecs[i] = i-th eigenvector
}
function signFix(v) { const s = v.reduce((a, b) => a + b, 0); let sg = s; if (Math.abs(s) < 1e-9) { sg = v.reduce((a, b) => Math.abs(b) > Math.abs(a) ? b : a, 0); } return sg < 0 ? v.map(x => -x) : v; }
function svd(A) {
  const { vals, vecs } = jacobi(mm(Tr(A), A));
  const out = { s: [], U: [], V: [] };
  vals.forEach((l, i) => {
    const s = Math.sqrt(Math.max(l, 0)); if (s < 1e-7) return;
    const v = signFix(vecs[i]); const u = A.map(r => r.reduce((t, x, k) => t + x * v[k], 0) / s);
    out.s.push(s); out.V.push(v); out.U.push(u);

}
function rankOf(M) {
  const A = M.map(r => r.slice()), m = A.length, n = A[0].length; let r = 0;
  const scale = Math.max(1, ...A.flat().map(Math.abs));
  for (let c = 0; c < n && r < m; c++) {
    let p = r; for (let i = r + 1; i < m; i++) if (Math.abs(A[i][c]) > Math.abs(A[p][c])) p = i;
    if (Math.abs(A[p][c]) < 1e-9 * scale) continue;
    [A[r], A[p]] = [A[p], A[r]];
    for (let i = r + 1; i < m; i++) { const f = A[i][c] / A[r][c]; for (let j = c; j < n; j++) A[i][j] -= f * A[r][j]; }
    r++;

}
function solve(M, b) {
  const n = b.length, A = M.map((r, i) => [...r, b[i]]);
  for (let c = 0; c < n; c++) {
    let p = c; for (let i = c + 1; i < n; i++) if (Math.abs(A[i][c]) > Math.abs(A[p][c])) p = i;
    [A[c], A[p]] = [A[p], A[c]]; const d = A[c][c] || 1e-12;
    for (let i = c + 1; i < n; i++) { const f = A[i][c] / d; for (let j = c; j <= n; j++) A[i][j] -= f * A[c][j]; }
  }
  const x = Array(n).fill(0);
  for (let i = n - 1; i >= 0; i--) { let s = A[i][n]; for (let j = i + 1; j < n; j++) s -= A[i][j] * x[j]; x[i] = s / (A[i][i] || 1e-12); }
  return x;
}
// polynomial regression in Chebyshev basis (well conditioned on [-1,1])
function cheb(x, deg) { const t = [1, x]; for (let k = 2; k <= deg; k++) t.push(2 * x * t[k - 1] - t[k - 2]); return t.slice(0, deg + 1); }
function polyfit(xs, ys, deg) {

  const G = Array.from({ length: k }, (_, i) => Array.from({ length: k }, (_, j) => P.reduce((s, r) => s + r[i] * r[j], 0) + (i === j ? 1e-10 : 0)));
  const b = Array.from({ length: k }, (_, i) => P.reduce((s, r, n) => s + r[i] * ys[n], 0));
  const c = solve(G, b); return x => cheb(x, deg).reduce((s, v, i) => s + v * c[i], 0);
}
const mse = (f, xs, ys) => xs.reduce((s, x, i) => s + (f(x) - ys[i]) ** 2, 0) / xs.length;

function matHTML(M, opt = {}) {
  const d = opt.d ?? 2, cols = M[0].length, max = opt.max ?? Math.max(1e-9, ...M.flat().map(Math.abs));
  const cells = M.flat().map((v, i) => {
    const r = Math.floor(i / cols), c = i % cols; let st = '';
    if (opt.heat) { const a = Math.round(Math.min(1, Math.abs(v) / max) * 70); st = `background:color-mix(in srgb, var(${v >= 0 ? '--accent' : '--pos'}) ${a}%, transparent)`; }
    const hl = opt.hl && opt.hl(r, c) ? 'outline:2px solid var(--hl);outline-offset:-1px;' : '';
    return `<span style="${hl}${st}">${fmt(v, d)}</span>`;
  }).join('');
  return `<div><div class="mat" style="grid-template-columns:repeat(${cols},auto)">${cells}</div>${opt.cap ? `<div class="mat-cap">${opt.cap}</div>` : ''}</div>`;
}
